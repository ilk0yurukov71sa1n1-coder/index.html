<style>

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.track{height:620vh}
.label{position:fixed;left:20px;top:18px;z-index:3;pointer-events:none}
.label small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.label b{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin-top:2px}
.stage{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 16px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.prog{position:fixed;left:0;top:0;bottom:0;width:3px;z-index:3;background:rgba(255,255,255,.06)}
.prog i{display:block;width:100%;height:0;background:var(--acc)}
.panel{position:fixed;right:16px;top:16px;z-index:4;width:290px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:12px;font-size:13px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-top b{font-weight:600}
.toggle{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.grp{margin-top:12px}
.grp > span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:9px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button:hover{background:rgba(255,255,255,.09)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.panel.closed .grp{display:none}

  .panel{left:12px;right:12px;top:auto;bottom:64px;width:auto;padding:10px}
  .label{left:16px;top:14px}
  .label b{font-size:18px}
  .stage{bottom:16px;font-size:12px;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}

  <div class="grp"><span>Picture</span><div class="seg" id="segPic">
    <button type="button" data-v="site" aria-pressed="true">Website</button>
    <button type="button" data-v="photo" aria-pressed="false">Photo</button>
    <button type="button" data-v="poster" aria-pressed="false">Poster</button>
    <button type="button" data-v="upload" aria-pressed="false">Upload yours</button>
  </div></div>
  <div class="grp"><span>What comes out</span><div class="seg" id="segThing">
    <button type="button" data-v="orb" aria-pressed="true">Chrome orb</button>
    <button type="button" data-v="crystal" aria-pressed="false">Glass crystal</button>
    <button type="button" data-v="knot" aria-pressed="false">Gold knot</button>
    <button type="button" data-v="stone" aria-pressed="false">Stone</button>
  </div></div>
  <div class="grp"><span>The rip</span><div class="seg" id="segRip">
    <button type="button" data-v="down" aria-pressed="true">Straight down</button>
    <button type="button" data-v="diag" aria-pressed="false">Diagonal</button>
    <button type="button" data-v="zig" aria-pressed="false">Jagged</button>
  </div></div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="track" aria-hidden="true"></div>
<div id="err" hidden>The 3D engine couldn't load. Check your connection and reload the page.</div>

  var f = Math.max(0, Math.min(NR, (H / 2 - y) / H * NR)), j = Math.min(NR - 1, Math.floor(f)), a = f - j;
  function L(arr){ return arr[j] * (1 - a) + arr[j + 1] * a; }
  var xS = L(rowXS), t = x < L(rowXT) ? 1 : -1;
  curl(xS, t * (xS - x), t, L(rowL), L(rowR), L(rowS), tmpO);
  return new V3(tmpO.x, y, tmpO.z);
}

var lastP = -1;
function updateSheet(p){
  if (Math.abs(p - lastP) < 1e-4) return; lastP = p;
  var ripP = Math.min(1, Math.max(0, (p - .04) / .7)), yF = H / 2 + .4 - ripP * (H + 2.4);
  var grow = Math.min(1, Math.max(0, (p - .06) / .8)), Lmax = .25 + 1.9 * grow * grow * (3 - 2 * grow) + Math.max(0, p - .84) * 4;
  for (var j = 0; j <= NR; j++) {
    var y = rowY[j], o = Math.min(1, Math.max(0, (y - yF) / 1.6));
    if (y < yF) o = Math.max(0, 1 - (yF - y) / .35) * .05 * (ripP > 0 ? 1 : 0);
    var oe = o * o * (3 - 2 * o);
    rowO[j] = oe; rowL[j] = oe * Lmax * (1 + .18 * Math.sin(y * 1.3 + 2)); rowR[j] = .22 + .12 * oe; rowS[j] = oe * (.1 + Lmax * .05);
  }
  halves.forEach(function(h){
    var g = h.mesh.geometry, pos = g.attributes.position.array, open = g.attributes.aOpen.array, t = h.t;
    for (var j = 0; j <= NR; j++) for (var k = 0; k <= NC; k++) {
      var v = j * (NC + 1) + k; curl(rowXS[j], h.dist[v], t, rowL[j], rowR[j], rowS[j], tmpO);
      pos[v * 3] = tmpO.x; pos[v * 3 + 2] = tmpO.z; open[v] = rowO[j];
    }
    g.attributes.position.needsUpdate = true; g.attributes.aOpen.needsUpdate = true; g.computeVertexNormals();
  });
}

// ---------- the thing that comes out of the picture ----------
var thing = null, thingKind = "orb", spin = 0;
function makeThing(kind){
  if (thing) { scene.remove(thing); thing.traverse(function(o){ if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
  var g, m;
  if (kind === "orb") { g = new THREE.SphereGeometry(1.05, 96, 64); m = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .05 }); }
  else if (kind === "crystal") { g = new THREE.IcosahedronGeometry(1.15, 0); m = new THREE.MeshPhysicalMaterial({ color: 0xd6ecff, metalness: 0, roughness: .02, transparent: true, opacity: .55, clearcoat: 1, clearcoatRoughness: 0, envMapIntensity: 2.4, flatShading: true, side: THREE.DoubleSide }); }
  else if (kind === "knot") { g = new THREE.TorusKnotGeometry(.7, .25, 280, 40); m = new THREE.MeshStandardMaterial({ color: 0xe2b454, metalness: 1, roughness: .17 }); }
  else {
    g = new THREE.IcosahedronGeometry(1.02, 5); var p = g.attributes.position, v = new V3();
    for (var i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); var n = v.clone().normalize(), s = 1 + .07 * Math.sin(n.x * 5.1 + n.y * 3.3) + .05 * Math.sin(n.y * 9.7 - n.z * 6.1) + .025 * Math.sin(n.z * 21 + n.x * 17) - .04 * Math.abs(Math.sin(n.x * 2.3 + n.z * 1.9)); v.copy(n.multiplyScalar(1.02 * s)); v.y *= .82; p.setXYZ(i, v.x, v.y, v.z); }
    g.computeVertexNormals(); m = new THREE.MeshStandardMaterial({ color: 0x8d8377, roughness: .93, metalness: 0 });
  }
  thing = new THREE.Mesh(g, m); thing.castShadow = true; thing.receiveShadow = kind === "stone"; scene.add(thing);
  if (kind === "crystal") { var core = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 0), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .1, flatShading: true })); thing.add(core); }
}

// ---------- click: the picture breaks apart where you clicked, then grows back ----------
var shards = [], ray = new THREE.Raycaster(), mv = new THREE.Vector2(), clock = 0;
function holeR(r0, seed, ang){ return r0 * (1 + .16 * Math.sin(5 * ang + seed) + .08 * Math.sin(11 * ang + seed * 2) + .03 * Math.sin(37 * ang + seed)); }
function breakAt(fx, fy){
  var seed = Math.random() * 6.28, r0 = .5 + Math.random() * .18, S = 11, rings = [0, .36 + Math.random() * .08, .68 + Math.random() * .08, 1];
  if (holes.length >= HOLE_MAX) holes.shift();
  holes.push({ x: fx, y: fy, r0: r0, seed: seed, t0: clock });
  var angs = []; for (var i = 0; i < S; i++) angs.push((i + (Math.random() - .5) * .5) / S * Math.PI * 2);
  function P(ri, si){ var a = angs[(si + S) % S], rr = ri === 3 ? holeR(r0, seed, a) : r0 * rings[ri] * (1 + (Math.random() - .5) * .12); return [fx + Math.cos(a) * rr, fy + Math.sin(a) * rr]; }
  var grid = []; for (var r = 1; r <= 3; r++) { grid[r] = []; for (var s = 0; s < S; s++) grid[r][s] = P(r, s); }
  var mat = paperMat(false); mat.transparent = true;
  var cells = [];
  for (var s2 = 0; s2 < S; s2++) cells.push([[fx, fy], grid[1][s2], grid[1][(s2 + 1) % S]]);
  for (var r2 = 1; r2 < 3; r2++) for (var s3 = 0; s3 < S; s3++) cells.push([grid[r2][s3], grid[r2 + 1][s3], grid[r2 + 1][(s3 + 1) % S], grid[r2][(s3 + 1) % S]]);
  var cWorld = deformFlat(fx, fy);
  cells.forEach(function(poly){
    var cx = 0, cy = 0; poly.forEach(function(q){ cx += q[0]; cy += q[1]; }); cx /= poly.length; cy /= poly.length;
    var cw = deformFlat(cx, cy), pts = poly.map(function(q){ return deformFlat(q[0], q[1]).sub(cw); });
    var tri = poly.length === 3 ? [0, 1, 2] : [0, 1, 2, 0, 2, 3], pos = [], uv = [];
    tri.forEach(function(i){ pos.push(pts[i].x, pts[i].y, pts[i].z); uv.push(poly[i][0] / W + .5, poly[i][1] / H + .5); });
    var g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    var z = new Float32Array(tri.length); g.setAttribute("aFib", new THREE.BufferAttribute(z, 1)); g.setAttribute("aOpen", new THREE.BufferAttribute(z, 1));
    g.computeVertexNormals();
    var m = new THREE.Mesh(g, mat); m.position.copy(cw); m.castShadow = true; scene.add(m);
    var out = cw.clone().sub(cWorld); out.z = 0; var len = out.length() || .01; out.multiplyScalar(1 / len);
    shards.push({ m: m, mat: mat, t0: clock, v: new V3(out.x * (.6 + Math.random() * 1.2) * (.4 + len), .6 + Math.random() * 1.6, 1.4 + Math.random() * 2.4), w: new V3((Math.random() - .5) * 9, (Math.random() - .5) * 9, (Math.random() - .5) * 6) });
  });
}
function pick(e){
  mv.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1); ray.setFromCamera(mv, camera);
  if (thing) { var ht = ray.intersectObject(thing, true); if (ht.length) { spin += 6; return; } }
  var hit = ray.intersectObjects(halves.map(function(h){ return h.mesh; }));
  if (hit.length && hit[0].uv) breakAt((hit[0].uv.x - .5) * W, (hit[0].uv.y - .5) * H);
}
canvas.addEventListener("click", pick);

// ---------- loop ----------
var g = 0, mx = 0, my = 0, tmx = 0, tmy = 0, stage = document.getElementById("stage"), bar = document.getElementById("bar"), lastStage = "";
window.addEventListener("pointermove", function(e){ tmx = e.clientX / window.innerWidth - .5; tmy = e.clientY / window.innerHeight - .5; });
function progress(){ var max = document.documentElement.scrollHeight - window.innerHeight; return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0; }
function fitDist(){ var t = Math.tan(camera.fov / 2 * Math.PI / 180); return Math.min(H / 2 / t, W / 2 / (t * camera.aspect)) * .92; }
function resize(){ var w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize); resize();
function ease(x){ x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
var last = performance.now();
function frame(now){
  var dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  var p = progress(); g += (p - g) * (reduce ? 1 : Math.min(1, dt * 5)); if (Math.abs(p - g) < 1e-4) g = p;
  updateSheet(g);
  mx += (tmx - mx) * .05; my += (tmy - my) * .05;

  // camera: starts square on to the picture, pushes in, then swings round to show it is a real 3D object
  var push = ease((g - .5) / .4), orbit = ease((g - .78) / .22), d = fitDist() * (1 - .2 * push);
  var ang = orbit * .5 + mx * .12;
  camera.position.set(Math.sin(ang) * d, .15 - .55 * push - my * .35 + orbit * .6, Math.cos(ang) * d);
  camera.lookAt(0, -.15 * push, .5 * push);

  // the thing rises out of the picture
  if (thing) {
    var up = ease((g - .2) / .62);
    thing.position.set(Math.sin(clock * .6) * .08 + .1, -.2 + up * .25 + Math.sin(clock * 1.1) * .06, -3 + up * 4.6);
    spin *= .96; thing.rotation.y += dt * (.35 + spin); thing.rotation.x = .25 + g * 1.6;
    var vis = 2 * Math.tan(camera.fov / 2 * Math.PI / 180) * d * Math.min(1, camera.aspect), sc2 = (.7 + up * .45) * Math.min(1, vis / 6.5); thing.scale.setScalar(sc2);
  }

  // holes: open at once, wait for the pieces to fall, then grow back from the edges
  holeU.forEach(function(u){ u.set(0, 0, 0, 0); });
  holes = holes.filter(function(h){ return clock - h.t0 < 3.6; });
  holes.forEach(function(h, i){ var t = clock - h.t0, r = t < 1.5 ? h.r0 : h.r0 * (1 - ease((t - 1.5) / 2)); holeU[i].set(h.x, h.y, r, h.seed); });
  shards = shards.filter(function(s){
    var t = clock - s.t0;
    if (t > 2.6) { scene.remove(s.m); s.m.geometry.dispose(); return false; }
    s.v.y -= 7.5 * dt; s.m.position.addScaledVector(s.v, dt);
    s.m.rotation.x += s.w.x * dt; s.m.rotation.y += s.w.y * dt; s.m.rotation.z += s.w.z * dt;
    s.mat.opacity = t > 2 ? 1 - (t - 2) / .6 : 1;
    return true;
  });

  var label = g < .05 ? "Scroll to rip the picture open" : g < .45 ? "Keep scrolling, something is coming through" : g < .8 ? "Click the picture to break it" : "Click the picture to break it · it grows back";
  if (label !== lastStage) { stage.textContent = label; lastStage = label; }
  bar.style.height = (g * 100).toFixed(1) + "%";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- controls ----------
function seg(id, fn){
  var el = document.getElementById(id);
  el.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (!fn(b.dataset.v)) return;
    el.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
  });
}
var file = document.getElementById("file");
seg("segPic", function(v){ if (v === "upload" && !upload) { file.click(); return false; } picKind = v; drawPicture(); return true; });
file.addEventListener("change", function(){
  var f = file.files && file.files[0]; if (!f) return;
  var img = new Image(); img.onload = function(){ upload = img; picKind = "upload"; drawPicture(); document.querySelectorAll("#segPic button").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.v === "upload")); }); };
  img.src = URL.createObjectURL(f); file.value = "";
});
seg("segThing", function(v){ thingKind = v; makeThing(v); return true; });
seg("segRip", function(v){ ripKind = v; buildSheet(); return true; });
var panel = document.getElementById("panel"), tog = document.getElementById("tog");
tog.addEventListener("click", function(){ var c = panel.classList.toggle("closed"); tog.textContent = c ? "Customize" : "Hide"; tog.setAttribute("aria-expanded", String(!c)); });
if (window.innerWidth < 640) { panel.classList.add("closed"); tog.textContent = "Customize"; tog.setAttribute("aria-expanded", "false"); }

// fonts first, so the picture is drawn with the real type
var fontsReady = document.fonts ? Promise.all(["600 100px Fraunces", "500 30px Inter", "800 30px Inter", "400 100px Anton"].map(function(f){ return document.fonts.load(f); })) : Promise.resolve();
var started = false;
function start(){ if (started) return; started = true; drawPicture(); buildSheet(); makeThing(thingKind); requestAnimationFrame(frame); }
Promise.race([fontsReady, new Promise(function(r){ setTimeout(r, 2500); })]).then(start, start);
})();
</script>
</body>
