<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll 3D</title>
<style>
:root{--accent:#8a2226;--hi:#e0585c;--bg:#08070a;--ink:#ece7df;--mut:#8b858c;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;
--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.15'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:clip}
.intro{padding:34px 22px 22px;max-width:760px}
.intro h1{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.intro p{margin:0;color:var(--mut);font-size:14px;line-height:1.6}
.bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:9px 22px;background:rgba(8,7,10,.88);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08);font:11.5px var(--mono);color:var(--mut)}
.bar label{display:flex;gap:8px;align-items:center;white-space:nowrap}
.bar input[type=color]{width:26px;height:20px;border:0;padding:0;background:none}
.bar input[type=range]{width:96px;accent-color:var(--accent)}
.bar b{color:var(--ink);font-weight:500;margin-left:auto}
section.sc{position:relative;height:360vh}
section.sc .pin{position:sticky;top:var(--barh,44px);height:calc(100vh - var(--barh,44px));height:calc(100svh - var(--barh,44px));overflow:hidden;perspective:1200px;perspective-origin:50% 42%;display:grid;place-items:center;background:radial-gradient(ellipse 80% 60% at 50% 55%,#1a151d 0%,#0c0a0e 55%,#08070a 100%)}
section.sc .pin::before{content:"";position:absolute;inset:0;background:var(--grain);opacity:.1;mix-blend-mode:overlay;pointer-events:none;z-index:4}
section.sc .pin::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:4}
.floor{position:absolute;left:50%;top:50%;width:min(86vw,900px);height:200px;margin:150px 0 0 calc(min(86vw,900px) / -2);background:radial-gradient(ellipse at 50% 50%,rgba(138,34,38,.28),transparent 66%);filter:blur(12px);pointer-events:none;transform:rotateX(80deg)}
.cap{position:absolute;left:22px;bottom:20px;z-index:6;max-width:min(380px,calc(100vw - 110px));pointer-events:none}
.cap b{display:block;font-size:15px;margin-bottom:5px;letter-spacing:-.005em}
.cap span{font-size:12.5px;color:#9c969d;line-height:1.55}
.num{position:absolute;right:22px;bottom:20px;font:11.5px var(--mono);color:var(--mut);z-index:6}
.ticks{position:absolute;left:22px;right:22px;top:14px;height:2px;z-index:6;background:rgba(255,255,255,.1);border-radius:2px}
.ticks i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--accent),var(--hi));border-radius:2px}
.rig{position:relative;width:0;height:0;transform-style:preserve-3d}
.pnl{position:absolute;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:16px;border-radius:12px;background:linear-gradient(158deg,#2b262f 0%,#17131a 58%,#100d13 100%);box-shadow:0 0 0 1px rgba(255,255,255,.09) inset,0 1px 0 rgba(255,255,255,.2) inset,0 34px 50px -22px rgba(0,0,0,.9),0 10px 18px -10px rgba(0,0,0,.7);backface-visibility:hidden;overflow:hidden;--sx:0}
.pnl .art{position:absolute;left:12px;right:12px;top:12px;height:46%;border-radius:8px;background:radial-gradient(ellipse at 28% 30%,rgba(255,226,196,.42),transparent 52%),radial-gradient(ellipse at 78% 80%,rgba(138,34,38,.55),transparent 60%),linear-gradient(140deg,#3a3036,#1b1620);box-shadow:0 0 0 1px rgba(255,255,255,.07) inset}
.pnl::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent calc(var(--sx) * 100% - 30%),rgba(255,255,255,.16) calc(var(--sx) * 100%),transparent calc(var(--sx) * 100% + 30%));pointer-events:none;mix-blend-mode:screen}
.pnl::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.12;mix-blend-mode:overlay;pointer-events:none}
.pnl h4{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em;position:relative}
.pnl i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.14);position:relative}
.pnl .tag{position:absolute;right:16px;bottom:15px;font:10px var(--mono);letter-spacing:.14em;color:var(--hi);z-index:1}
.pnl.lt{background:linear-gradient(158deg,#f6f2ea 0%,#e4ded2 62%,#d3ccbf 100%);color:#1c191e;box-shadow:0 0 0 1px rgba(0,0,0,.06) inset,0 1px 0 rgba(255,255,255,.9) inset,0 34px 50px -22px rgba(0,0,0,.9),0 10px 18px -10px rgba(0,0,0,.7)}
.pnl.lt i{background:rgba(0,0,0,.15)}
.pnl.lt .art{background:radial-gradient(ellipse at 30% 28%,rgba(255,255,255,.8),transparent 55%),linear-gradient(140deg,#cfc6b8,#a99e8d);box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.pnl.rd{background:linear-gradient(158deg,#b3343a 0%,#7b1d21 55%,#4d0f12 100%)}
.pnl.rd i{background:rgba(255,255,255,.28)}
.pnl.rd .art{background:radial-gradient(ellipse at 30% 30%,rgba(255,200,190,.5),transparent 56%),linear-gradient(140deg,#8e262b,#54121a)}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;border-radius:inherit}
@media (max-width:640px){.intro{padding:26px 16px 18px}.bar{padding:8px 16px}.cap{left:16px;bottom:16px}.num{right:16px;bottom:16px}.ticks{left:16px;right:16px}}
@media (prefers-reduced-motion:reduce){section.sc{height:auto}section.sc .pin{position:relative;height:90vh}}
</style>
</head>
<body>
<div class="intro">
  <h1>Scroll 3D</h1>
  <p>Twelve scroll-driven 3D effects. Scroll each section: the scene follows how far you have scrolled, catches the light as it moves, and leans toward your pointer or your finger. The panels are placeholders for the client's own photos and words.</p>
</div>
<div class="bar" id="bar">
  <label>Accent <input id="acc" type="color" value="#8a2226"></label>
  <label>Lean <input id="lean" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label>Depth <input id="dep" type="range" min="0.5" max="1.6" step="0.05" value="1"></label>
  <b id="now">1 / 12</b>
</div>
<div id="root"></div>
<script>
(function () {
  var root = document.getElementById('root'), bar = document.getElementById('bar'), LEAN = 1, DEP = 1, PI = Math.PI, SC = 1;
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function sm(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function el(tag, cls, html, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
  var M = { x: 0, y: 0, tx: 0, ty: 0 };
  function pt(e) { M.tx = e.clientX / innerWidth * 2 - 1; M.ty = e.clientY / innerHeight * 2 - 1; }
  window.addEventListener('pointermove', pt, { passive: true }); window.addEventListener('pointerdown', pt, { passive: true });
  function layout() { SC = clamp(Math.min(innerWidth / 680, innerHeight / 700), 0.5, 1); document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', layout); layout();
  var NAMES = ['Rooms', 'Spa', 'Dining', 'Events', 'Offers', 'Contact', 'Gallery', 'Booking', 'Story'];
  function pnl(parent, i, w, h, cls, noArt) {
    var p = el('div', 'pnl' + (cls ? ' ' + cls : ''), (noArt ? '' : '<span class="art"></span>') + '<span class="tag">0' + ((i % 9) + 1) + '</span><h4>' + NAMES[i % 9] + '</h4><i style="width:78%"></i><i style="width:52%"></i>', parent);
    p.style.width = w + 'px'; p.style.height = h + 'px'; p.style.left = (-w / 2) + 'px'; p.style.top = (-h / 2) + 'px'; return p;
  }
  function sweep(p, v) { p.style.setProperty('--sx', v.toFixed(3)); }

  var scenes = [
    { name: 'Cube turn', note: 'A cube of page cards turns face to face and pushes toward you at the end.',
      build: function (rig) {
        var cube = el('div', 'rig', '', rig), S = 150, ps = [];
        ['rotateY(0deg)', 'rotateY(90deg)', 'rotateY(180deg)', 'rotateY(-90deg)', 'rotateX(90deg)', 'rotateX(-90deg)'].forEach(function (t, i) { var p = pnl(cube, i, S * 2, S * 2, i % 3 === 1 ? 'lt' : i === 4 ? 'rd' : ''); p.style.transform = t + ' translateZ(' + S + 'px)'; ps.push(p); });
        return function (p) { var a = sm(0, 0.9, p); cube.style.transform = 'translateZ(' + (-120 + sm(0.8, 1, p) * 260) * DEP + 'px) rotateX(' + (-14 - a * 40) + 'deg) rotateY(' + (-30 + a * 270) + 'deg)'; ps.forEach(function (x, i) { sweep(x, ((a * 1.4 + i * 0.17) % 1)); }); };
      } },
    { name: 'Tunnel flight', note: 'Frames stand one behind the other and you fly through them.',
      build: function (rig) {
        var fr = []; for (var i = 0; i < 9; i++) { var p = pnl(rig, i, 420, 270, i % 4 === 0 ? 'rd' : i % 2 ? 'lt' : ''); p.dataset.z = -i * 340; fr.push(p); }
        return function (p) { var cam = p * 2600 * DEP; fr.forEach(function (f, i) { var z = +f.dataset.z + cam; f.style.transform = 'translate3d(' + (Math.sin(i * 1.7) * 90) + 'px,' + (Math.cos(i * 1.3) * 50) + 'px,' + z + 'px) rotateZ(' + (Math.sin(i) * 5) + 'deg)'; f.style.opacity = clamp(1 - (z - 250) / 250, 0, 1) * clamp((z + 2500) / 900, 0, 1); sweep(f, (p * 2 + i * 0.1) % 1); }); };
      } },
    { name: 'Fan and fold', note: 'A stack of cards fans into an arc, then one card lifts out of the stack.',
      build: function (rig) {
        var cs = []; for (var i = 0; i < 7; i++) cs.push(pnl(rig, i, 220, 300, i % 3 === 1 ? 'lt' : i === 3 ? 'rd' : ''));
        return function (p) { var a = sm(0.05, 0.6, p), b = sm(0.6, 1, p); cs.forEach(function (c, i) { var k = i - 3; c.style.transform = 'translate3d(' + (k * 90 * a * DEP) + 'px,' + (Math.abs(k) * 10 * a - b * (i === 3 ? 90 : 0)) + 'px,' + (i * 3) + 'px) rotateZ(' + (k * 13 * a) + 'deg) rotateY(' + (k * -8 * a) + 'deg) rotateX(' + (14 - b * 14) + 'deg)'; sweep(c, (a * 0.8 + i * 0.1) % 1); }); };
      } },
    { name: 'Cylinder ring', note: 'Panels stand on a ring around you. Scrolling turns it while the camera tilts over it.',
      build: function (rig) {
        var ring = el('div', 'rig', '', rig), n = 9, R = 430, ps = [];
        for (var i = 0; i < n; i++) { var p = pnl(ring, i, 230, 290, i % 3 === 0 ? 'rd' : i % 3 === 1 ? 'lt' : ''); p.style.backfaceVisibility = 'hidden'; ps.push(p); }
        return function (p) { ring.style.transform = 'translateZ(' + (-R * DEP) + 'px) rotateX(' + (-8 - sm(0, 1, p) * 16) + 'deg) rotateY(' + (p * 340 + 20) + 'deg)'; ps.forEach(function (c, i) { c.style.transform = 'rotateY(' + (i * 360 / n) + 'deg) translateZ(' + (R * DEP) + 'px)'; sweep(c, (p * 2 + i / n) % 1); }); };
      } },
    { name: 'Book open', note: 'A book opens one page at a time. Each page darkens as it turns away from the light.',
      build: function (rig) {
        var bk = el('div', 'rig', '', rig), pgs = [], n = 6;
        for (var i = 0; i < n; i++) { var p = pnl(bk, i, 260, 340, i % 2 ? 'lt' : ''); p.style.left = '0px'; p.style.transformOrigin = '0 50%'; p._sh = el('div', 'shade', '', p); pgs.push(p); }
        return function (p) { bk.style.transform = 'translateX(' + (-130 * SC) + 'px) translateZ(' + (60 * DEP) + 'px) rotateX(' + (28 - sm(0, 1, p) * 8) + 'deg) rotateZ(-6deg)'; pgs.forEach(function (g, i) { var e = sm(0, 1, clamp(p * (n + 1) - i * 0.85 - 0.25, 0, 1)); g.style.transform = 'translateZ(' + (n - i) * 2 + 'px) rotateY(' + (-e * 168) + 'deg)'; g._sh.style.opacity = Math.sin(e * PI) * 0.5; sweep(g, e); g.style.backfaceVisibility = 'hidden'; }); };
      } },
    { name: 'Exploded layers', note: 'Five layers of one page pull apart in depth, then turn to show their edges.',
      build: function (rig) {
        var st = el('div', 'rig', '', rig), ps = [], T = ['Content', 'Photos', 'Motion', 'Booking', 'Base'];
        for (var i = 0; i < 5; i++) { var p = pnl(st, i, 380, 240, i === 0 ? 'lt' : i === 2 ? 'rd' : ''); p.querySelector('h4').textContent = T[i]; ps.push(p); }
        return function (p) { var a = sm(0.05, 0.55, p), b = sm(0.5, 1, p); st.style.transform = 'rotateX(' + (62 - b * 14) + 'deg) rotateZ(' + (-38 + b * 70) + 'deg) translateZ(' + (-40 * DEP) + 'px)'; ps.forEach(function (c, i) { c.style.transform = 'translateZ(' + ((4 - i) * 78 * a * DEP) + 'px)'; c.style.opacity = 0.6 + 0.4 * (1 - i / 5); sweep(c, (b + i * 0.15) % 1); }); };
      } },
    { name: 'Domino wall', note: 'A wall of tiles lies flat and stands up row by row, like dominoes.',
      build: function (rig) {
        var wall = el('div', 'rig', '', rig), ts = [], C = 5, R = 4;
        for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) { var p = pnl(wall, r * C + c, 150, 120, (r + c) % 4 === 0 ? 'rd' : (r + c) % 2 ? 'lt' : '', true); p.style.left = ((c - (C - 1) / 2) * 164 - 75) + 'px'; p.style.top = ((r - (R - 1) / 2) * 134 - 60) + 'px'; p.style.transformOrigin = '50% 100%'; p._r = r; p._c = c; ts.push(p); }
        return function (p) { wall.style.transform = 'translateZ(' + (-60 * DEP) + 'px) rotateX(-4deg)'; ts.forEach(function (t) { var e = sm(t._r * 0.16, t._r * 0.16 + 0.42, p); t.style.transform = 'rotateX(' + (84 - e * 84) + 'deg) translateZ(' + ((1 - e) * -30) + 'px)'; t.style.opacity = 0.25 + e * 0.75; sweep(t, (e + t._c * 0.12) % 1); }); };
      } },
    { name: 'Depth parallax', note: 'Front, middle and back layers sit at different depths while the camera swings around them.',
      build: function (rig) {
        var sc = el('div', 'rig', '', rig), ls = [];
        [[-480, 760, 420, '', -170, -60], [-300, 560, 330, 'lt', 120, 60], [-120, 420, 260, 'rd', -60, 90], [90, 300, 190, '', 160, -70], [260, 200, 130, 'lt', -30, 10]].forEach(function (d, i) { var p = pnl(sc, i + 2, d[1], d[2], d[3]); p.dataset.z = d[0]; p.dataset.x = d[4]; p.dataset.y = d[5]; ls.push(p); });
        return function (p) { var a = sm(0, 1, p) * 2 - 1; sc.style.transform = 'rotateY(' + (a * 24) + 'deg) rotateX(' + (a * -6) + 'deg)'; ls.forEach(function (l, i) { l.style.transform = 'translate3d(' + (+l.dataset.x + a * -(+l.dataset.z) * 0.16) + 'px,' + (+l.dataset.y) + 'px,' + (+l.dataset.z * DEP) + 'px)'; sweep(l, (p * 1.5 + i * 0.2) % 1); }); };
      } },
    { name: 'Double doors', note: 'Two tall doors stand closed, swing open and the next page waits behind them.',
      build: function (rig) {
        var back = pnl(rig, 6, 520, 340, 'lt'), L = pnl(rig, 0, 270, 360, ''), Rr = pnl(rig, 1, 270, 360, 'rd');
        L.style.left = '-270px'; L.style.transformOrigin = '0 50%'; Rr.style.left = '0px'; Rr.style.transformOrigin = '100% 50%'; back.style.transform = 'translateZ(-80px)';
        return function (p) { var a = sm(0.1, 0.7, p), z = sm(0.6, 1, p); rig.style.transform = 'translateZ(' + (z * 220 * DEP) + 'px)'; L.style.transform = 'rotateY(' + (-a * 110) + 'deg)'; Rr.style.transform = 'rotateY(' + (a * 110) + 'deg)'; back.style.transform = 'translateZ(' + (-80 + a * 40) + 'px) scale(' + (0.92 + a * 0.08) + ')'; sweep(L, a); sweep(Rr, 1 - a); sweep(back, z); };
      } },
    { name: 'Spiral stair', note: 'Cards climb a spiral staircase around a central axis as you scroll.',
      build: function (rig) {
        var ax = el('div', 'rig', '', rig), cs = [], n = 18;
        for (var i = 0; i < n; i++) { var p = pnl(ax, i, 170, 108, i % 4 === 0 ? 'rd' : i % 2 ? 'lt' : '', true); cs.push(p); }
        return function (p) { var rot = p * 300; ax.style.transform = 'translateZ(' + (-260 * DEP) + 'px) rotateX(-12deg) rotateY(' + rot + 'deg)'; cs.forEach(function (c, i) { var a = i * 30, y = (i - n / 2) * 30 + (0.5 - p) * 120; c.style.transform = 'translateY(' + y + 'px) rotateY(' + a + 'deg) translateZ(' + (250 * DEP) + 'px)'; sweep(c, ((rot + a) / 360 + 1) % 1); c.style.opacity = 0.55 + 0.45 * Math.abs(Math.cos((rot + a) * PI / 360 / 1)); }); };
      } },
    { name: 'Wave wall', note: 'A grid of tall panels ripples like cloth: a wave crosses the wall as you scroll.',
      build: function (rig) {
        var wall = el('div', 'rig', '', rig), ts = [], C = 9;
        for (var c = 0; c < C; c++) { var p = pnl(wall, c, 84, 300, c % 4 === 0 ? 'rd' : c % 2 ? 'lt' : '', true); p.style.left = ((c - (C - 1) / 2) * 92 - 42) + 'px'; p._c = c; ts.push(p); }
        return function (p) { wall.style.transform = 'translateZ(' + (-80 * DEP) + 'px) rotateX(-10deg) rotateY(' + (-24 + p * 48) + 'deg)'; ts.forEach(function (t) { var ph = p * 3.2 * PI * 2 - t._c * 0.7; var z = Math.sin(ph) * 90 * DEP, ry = Math.cos(ph) * 28; t.style.transform = 'translateZ(' + z + 'px) rotateY(' + ry + 'deg)'; sweep(t, (Math.sin(ph) + 1) / 2); }); };
      } },
    { name: 'Prism triptych', note: 'A three-sided prism turns slowly through its pages while it drifts toward you.',
      build: function (rig) {
        var pr = el('div', 'rig', '', rig), ps = [], W = 300, ap = W / (2 * Math.tan(PI / 3));
        for (var i = 0; i < 3; i++) { var p = pnl(pr, i + 3, W, 380, i === 1 ? 'lt' : i === 2 ? 'rd' : ''); p.style.transform = 'rotateY(' + (i * 120) + 'deg) translateZ(' + ap + 'px)'; ps.push(p); }
        return function (p) { var r = p * 480; pr.style.transform = 'translateZ(' + (-80 + sm(0.6, 1, p) * 200) * DEP + 'px) rotateX(' + (-8 + Math.sin(p * PI) * -8) + 'deg) rotateY(' + r + 'deg)'; ps.forEach(function (x, i) { sweep(x, ((r + i * 120) / 360 + 2) % 1); }); };
      } }
  ];

  var live = [];
  scenes.forEach(function (s, i) {
    var sec = el('section', 'sc', '', root), pin = el('div', 'pin', '', sec);
    var tk = el('div', 'ticks', '<i></i>', pin); el('div', 'floor', '', pin);
    var holder = el('div', 'rig', '', pin), rig = el('div', 'rig', '', holder);
    el('div', 'cap', '<b>' + s.name + '</b><span>' + s.note + '</span>', pin); el('div', 'num', (i + 1) + ' / ' + scenes.length, pin);
    live.push({ sec: sec, holder: holder, rig: rig, fn: s.build(rig), bar: tk.firstChild, i: i, p: 0 });
  });

  function frame() {
    M.x += (M.tx - M.x) * 0.07; M.y += (M.ty - M.y) * 0.07;
    var best = 0, bestV = -1;
    live.forEach(function (L) {
      var r = L.sec.getBoundingClientRect();
      if (r.bottom < -80 || r.top > innerHeight + 80) return;
      var p = clamp(-r.top / (r.height - innerHeight), 0, 1);
      L.p += (p - L.p) * 0.12;
      L.bar.style.width = (L.p * 100) + '%';
      L.holder.style.transform = 'scale(' + SC + ') rotateX(' + (M.y * -6 * LEAN) + 'deg) rotateY(' + (M.x * 9 * LEAN) + 'deg)';
      L.fn(L.p);
      var vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0); if (vis > bestV) { bestV = vis; best = L.i; }
    });
    document.getElementById('now').textContent = (best + 1) + ' / ' + scenes.length;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('lean').addEventListener('input', function (e) { LEAN = +e.target.value; });
  document.getElementById('dep').addEventListener('input', function (e) { DEP = +e.target.value; });
  document.getElementById('acc').addEventListener('input', function (e) { var h = e.target.value, n = parseInt(h.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { return Math.round(v + (255 - v) * 0.5); }); var s = document.documentElement.style; s.setProperty('--accent', h); s.setProperty('--hi', 'rgb(' + c.join(',') + ')'); });
})();
</script>
</body>
</html>
