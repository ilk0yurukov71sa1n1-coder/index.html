<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Click Loaders</title>
<style>
:root{--bg:#0b0a0b;--card:#131114;--line:rgba(255,255,255,.08);--fg:#efe9e1;--muted:#8d8680;--accent:#8a2226;--hi:#e0585c;--paper:#ece6dc;--r:6px;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 70px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:16px}
.bar label{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.bar input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:var(--r);background:none;padding:2px}
.bar input[type=range]{width:130px;accent-color:var(--accent)}
.bar button{background:#1a1215;color:var(--fg);border:1px solid rgba(224,88,92,.5);border-radius:var(--r);padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.stage{position:relative;height:230px;perspective:820px;overflow:hidden;background:radial-gradient(ellipse at 50% 118%,rgba(138,34,38,.16),transparent 62%),linear-gradient(180deg,#0f0e11,#0c0b0d);touch-action:manipulation}
.floor{position:absolute;left:50%;bottom:16px;width:170px;height:26px;margin-left:-85px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%);pointer-events:none;opacity:0}
.cap{padding:12px 14px 14px;border-top:1px solid var(--line)}
.cap b{display:block;font-weight:600;font-size:13px}
.cap span{color:var(--muted);font-size:12px}
.abs{position:absolute;left:50%;top:50%;transform-style:preserve-3d;pointer-events:none}
.trig{position:absolute;left:50%;top:50%;width:190px;height:54px;margin:0;padding:0;border:0;border-radius:var(--r);background:linear-gradient(180deg,#1d1a20,#131115);color:var(--fg);font:600 14px var(--sans);letter-spacing:.02em;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 1px 0 rgba(255,255,255,.08) inset,0 16px 26px -14px #000;-webkit-tap-highlight-color:transparent;will-change:transform}
.trig:focus-visible{outline:2px solid var(--hi);outline-offset:4px}
.trig::after{content:"";position:absolute;inset:0;border-radius:var(--r);background:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),rgba(224,88,92,.25),transparent 70%);opacity:var(--hh,0)}
.mono{font-family:var(--mono)}
.face3{backface-visibility:hidden}

/* 1 cube */
.cube{width:80px;height:80px;margin:-40px 0 0 -40px}
.cube .roll{position:absolute;inset:0;transform-style:preserve-3d}
.cf{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#2c272e,#151216);border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 1px 0 rgba(255,255,255,.3) inset;font:600 16px var(--mono);color:var(--fg);backface-visibility:hidden}
.cf.done{background:linear-gradient(145deg,var(--hi),var(--accent));color:#fff}
.cf.cap2{background:linear-gradient(145deg,#1f1b21,#121013)}
/* 2 flap */
.board{display:flex;gap:7px;margin:-50px 0 0 -105px;padding:14px 16px 14px 14px;border-radius:12px;background:linear-gradient(180deg,#1b181d,#0f0d11);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 22px 34px -14px #000;align-items:center}
.fd{position:relative;width:46px;height:68px;font:700 44px/68px var(--mono);text-align:center;color:var(--fg)}
.fd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:linear-gradient(180deg,#2a252c,#1d191f);border:1px solid rgba(255,255,255,.1)}
.fd .h span{position:absolute;left:0;right:0;height:68px;line-height:68px}
.fd .t{top:0;border-radius:5px 5px 0 0;border-bottom:0}.fd .t span{top:0}
.fd .b{bottom:0;border-radius:0 0 5px 5px;background:linear-gradient(180deg,#18151a,#211d23)}.fd .b span{bottom:0}
.fd .fl{z-index:3;backface-visibility:hidden}
.fd::after{content:"";position:absolute;left:-5px;right:-5px;top:50%;height:2px;margin-top:-1px;background:#050405;z-index:5;box-shadow:0 1px 0 rgba(255,255,255,.14)}
.fd.lit .h{color:var(--hi)}
.pc{font:600 13px var(--mono);color:var(--muted)}
/* 3 rings */
.gy{width:130px;height:130px;margin:-65px 0 0 -65px}
.rg{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 10px rgba(255,255,255,.12)}
.core{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#4a4450,#1a171c 62%)}
.gd{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 34% 28%,var(--hi),var(--accent) 60%,#4a1114);display:grid;place-items:center;color:#fff;font:700 22px var(--sans);box-shadow:0 0 22px var(--accent)}
/* 4 deal */
.tray{width:164px;height:106px;margin:-53px 0 0 -82px;border:1px solid rgba(255,255,255,.28);border-radius:9px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:0 0 0 4px rgba(0,0,0,.35),0 30px 30px -10px #000}
.cd{position:absolute;left:46px;top:28px;width:72px;height:48px;border-radius:5px;background:#e9e3d9;box-shadow:0 1px 0 #fff inset,0 3px 8px rgba(0,0,0,.6)}
.cd i{position:absolute;left:9px;right:9px;height:3px;border-radius:2px;background:rgba(0,0,0,.2)}
.cd b{position:absolute;right:7px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
/* 5 printer */
.prn{width:160px;margin:-84px 0 0 -80px}
.pbody{height:40px;border-radius:8px;background:linear-gradient(180deg,#2a262d,#17141a);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 1px 0 rgba(255,255,255,.2) inset,0 14px 20px -10px #000;position:relative;transform:translateZ(8px)}
.pbody::after{content:"";position:absolute;left:14px;right:14px;bottom:9px;height:3px;border-radius:2px;background:#030203;box-shadow:0 1px 0 rgba(255,255,255,.12)}
.pled{position:absolute;right:12px;top:10px;width:6px;height:6px;border-radius:50%;background:#3a353b}
.pled.on{background:var(--hi);box-shadow:0 0 10px var(--accent)}
.paper{position:absolute;left:16px;top:34px;width:128px;background:linear-gradient(90deg,#e3ddd2,#f1ece3 50%,#e3ddd2);overflow:hidden;box-shadow:0 10px 16px -6px rgba(0,0,0,.7);height:0}
.paper em{display:block;font:700 8px var(--mono);letter-spacing:.2em;color:#555;text-align:center;padding:9px 0 3px;border-bottom:1px dashed rgba(0,0,0,.3);margin:0 8px;font-style:normal}
.paper i{display:block;height:4px;border-radius:2px;background:rgba(0,0,0,.24);margin:9px 10px 0;width:0}
.stamp{position:absolute;left:50%;top:60%;margin:-14px 0 0 -38px;width:76px;padding:4px 0;text-align:center;border:2px solid var(--accent);color:var(--accent);font:800 14px var(--mono);letter-spacing:.14em;border-radius:3px;opacity:0}
/* 6 sphere */
canvas.sp{position:absolute;left:50%;top:50%;width:260px;height:200px;margin:-100px 0 0 -130px;pointer-events:none}
/* 7 dial */
.vault{width:164px;height:164px;margin:-82px 0 0 -82px}
.vbk{position:absolute;inset:6px;border-radius:12px;background:radial-gradient(circle at 50% 50%,var(--hi),var(--accent) 55%,#2a0a0c);box-shadow:0 0 34px var(--accent);opacity:0}
.dl,.dr{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(160deg,#2a262d,#141216);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 1px 0 rgba(255,255,255,.2) inset}
.dl{left:0;border-radius:14px 0 0 14px;transform-origin:0 50%}.dr{right:0;border-radius:0 14px 14px 0;transform-origin:100% 50%}
.led{position:absolute;top:11px;width:9px;height:9px;border-radius:50%;background:#2a252b;z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.5) inset}
.led.on{background:var(--hi);box-shadow:0 0 10px var(--accent)}
.bez{position:absolute;left:50%;top:55%;width:116px;height:116px;margin:-58px;border-radius:50%;background:conic-gradient(#8c8790,#3a363c,#a8a3ab,#33303a,#8c8790);box-shadow:0 8px 14px -4px #000,0 0 0 1px #000}
.knob{position:absolute;inset:11px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.6) 0 1deg,transparent 1deg 6deg),radial-gradient(circle,#2a262c 0 64%,#17141a 65%);box-shadow:0 0 0 2px #060506}
.knob::before{content:"";position:absolute;left:50%;top:4px;width:4px;height:17px;margin-left:-2px;background:var(--hi);border-radius:2px;box-shadow:0 0 6px var(--accent)}
.knob::after{content:"";position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#4a444c,#18151a)}
.dialhit{width:110px;height:110px;margin:-48px 0 0 -55px;border-radius:50%;background:transparent;box-shadow:none}
/* 8 tank */
.tank{overflow:hidden;width:236px;height:64px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 18px 28px -14px #000}
.tank .liq{position:absolute;left:-40%;width:180%;height:220%;top:100%;background:linear-gradient(180deg,var(--hi) 0,var(--accent) 14%,#3a0e10 100%);border-radius:48% 52% 0 0/9px 9px 0 0;transform-origin:50% 0;box-shadow:0 2px 0 rgba(255,255,255,.35) inset}
.tank .bub{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);z-index:1}
.tank .tl{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none}
.tank::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:12px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);z-index:3;pointer-events:none}
/* 9 padlock */
.lock{width:104px;height:128px;margin:-64px 0 0 -52px}
.sh{position:absolute;left:24px;top:0;width:56px;height:60px;border:9px solid #c9c3ba;border-bottom:0;border-radius:30px 30px 0 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transform-origin:9px 100%}
.lb{position:absolute;left:0;width:104px;top:52px;height:72px;border-radius:10px;background:linear-gradient(160deg,#37323b,#19161b);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 1px 0 rgba(255,255,255,.28) inset}
.lb.s{background:#0e0c10;box-shadow:none}
.kh{position:absolute;left:50%;top:76px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#050405;transform:translateZ(1px)}
.kh::after{content:"";position:absolute;left:50%;top:12px;width:6px;height:18px;margin-left:-3px;background:#050405;border-radius:0 0 3px 3px}
.key{position:absolute;left:50%;top:84px;width:20px;height:20px;margin:-14px 0 0 -10px;transform-style:preserve-3d}
.key i{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#efe9df,#8f897f);box-shadow:0 0 0 1px #000}
.key u{position:absolute;left:50%;top:14px;width:6px;height:38px;margin-left:-3px;background:linear-gradient(90deg,#d8d2c8,#8f897f);border-radius:2px;text-decoration:none}
/* 10 deploy */
.stk{width:130px;height:84px;margin:-42px 0 0 -65px}
.pl{position:absolute;inset:0;border-radius:7px;border:1px solid rgba(255,255,255,.26);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03))}
.pl i{position:absolute;left:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.pl.on{border-color:var(--hi);background:linear-gradient(160deg,rgba(224,88,92,.45),rgba(138,34,38,.25));box-shadow:0 0 22px rgba(138,34,38,.8)}
.pk{position:absolute;left:58px;top:36px;width:14px;height:14px;border-radius:3px;background:#fff;box-shadow:0 0 14px var(--hi)}
/* 11 tumbler */
.tum{display:flex;gap:8px;margin:-48px 0 0 -112px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#1b181d,#0e0c10);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 22px 34px -14px #000}
.td{position:relative;width:46px;height:84px;perspective:260px;overflow:hidden;border-radius:6px;background:#08070a;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.tdr{position:absolute;left:0;right:0;top:50%;height:30px;margin-top:-15px;transform-style:preserve-3d}
.dg{position:absolute;left:0;right:0;top:0;height:30px;line-height:30px;text-align:center;font:700 24px var(--mono);color:#d8d2c8;backface-visibility:hidden}
.td.ok .dg{color:var(--hi)}
.td::after{content:"";position:absolute;left:0;right:0;top:50%;height:30px;margin-top:-15px;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18);pointer-events:none}
/* 12 envelope */
.env{width:140px;height:92px;margin:-46px 0 0 -70px}
.eb{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,#2c282f,#17141a);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
.ep{position:absolute;left:14px;right:14px;top:8px;height:70px;border-radius:3px;background:linear-gradient(90deg,#e3ddd2,#f1ece3);transform:translateZ(1px)}
.ep i{position:absolute;left:10px;right:10px;height:3px;background:rgba(0,0,0,.2);border-radius:2px}
.ef{position:absolute;inset:0;background:linear-gradient(160deg,#35303a,#1a171c);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);transform:translateZ(3px)}
.efl{position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(180deg,#3d3742,#262229);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.seal::after{content:"";width:10px;height:10px;border:1.5px solid rgba(255,255,255,.7);transform:rotate(45deg);border-radius:2px}.seal{position:absolute;left:50%;top:46px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--hi),var(--accent) 65%,#3a0e10);box-shadow:0 2px 6px rgba(0,0,0,.6);transform:translateZ(8px) scale(0);display:grid;place-items:center;color:#fff;font:700 10px var(--mono)}
/* 13 coins */
.coins{width:84px;height:84px;margin:-42px 0 0 -42px}
.cn{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f1ece3,#9d978d 58%,#6c665e);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.cn.top{background:radial-gradient(circle at 38% 32%,var(--hi),var(--accent) 60%,#3a0e10)}
.cn.ed{background:#5a554e}
/* 14 iris */
.iris{width:170px;height:170px;margin:-85px 0 0 -85px}
.iris svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flash{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0}
/* 15 seal */
.sheet{width:150px;height:116px;margin:-58px 0 0 -75px;border-radius:5px;background:linear-gradient(135deg,#efe9df,#d9d2c6);box-shadow:0 18px 26px -10px #000}
.sheet i{position:absolute;left:14px;height:3px;border-radius:2px;background:rgba(0,0,0,.18)}
.wax{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:radial-gradient(circle at 36% 30%,var(--hi),var(--accent) 60%,#3a0e10);box-shadow:0 3px 8px rgba(0,0,0,.55);display:grid;place-items:center;color:rgba(255,255,255,.85);font:800 18px var(--mono);letter-spacing:.04em;transform:scale(0)}
.wax::before{content:"";position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.5);transform:rotate(45deg);border-radius:3px}.wax::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}
.stampr{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;transform-style:preserve-3d}
.stampr .st1{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#3a353d,#16131a);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.stampr .st2{position:absolute;left:16px;right:16px;top:-30px;height:34px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#3a353d,#6a646d,#2a262c);transform:translateZ(14px)}
/* 16 ticket */
.gate{width:150px;height:200px;margin:-100px 0 0 -75px}
.slot{position:absolute;left:-6px;right:-6px;top:0;height:34px;border-radius:9px;background:linear-gradient(180deg,#2b272e,#15121a);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 12px 18px -8px #000;z-index:4;transform:translateZ(10px)}
.slot::after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:4px;border-radius:2px;background:#020102}
.tk{position:absolute;left:12px;width:126px;top:18px;height:150px;background:linear-gradient(90deg,#e2dcd1,#f2ede4 50%,#e2dcd1);border-radius:4px;box-shadow:0 14px 20px -8px rgba(0,0,0,.7)}
.tk .bnd{position:absolute;left:0;right:0;top:48px;height:26px;background:var(--accent);color:#fff;font:700 9px/26px var(--mono);letter-spacing:.2em;text-align:center}
.tk .bc{position:absolute;left:14px;right:14px;bottom:34px;height:30px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px)}
.tk .perf{position:absolute;left:0;right:0;bottom:22px;border-top:2px dashed rgba(0,0,0,.3)}
.tk .stub{position:absolute;left:0;right:0;bottom:0;height:22px;background:inherit;border-radius:0 0 4px 4px;transform-origin:0 0}
/* 17 signature */
.doc{width:200px;height:130px;margin:-65px 0 0 -100px;border-radius:5px;background:linear-gradient(135deg,#efe9df,#d9d2c6);box-shadow:0 20px 28px -10px #000}
.doc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.doc u{position:absolute;left:18px;right:18px;bottom:34px;height:1px;background:rgba(0,0,0,.35);text-decoration:none}
.doc .tx{position:absolute;left:18px;top:14px;font:600 8px var(--mono);letter-spacing:.2em;color:#777}
.pen{position:absolute;left:0;top:0;width:8px;height:54px;margin:-52px 0 0 -2px;background:linear-gradient(90deg,#1a171c,#6a646d,#1a171c);border-radius:4px 4px 1px 1px;transform-origin:50% 100%;transform:rotate(28deg);box-shadow:0 6px 8px rgba(0,0,0,.4)}
.pen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--accent)}
.sg{position:absolute;right:16px;bottom:10px;font:800 11px var(--mono);letter-spacing:.2em;color:var(--accent);border:2px solid var(--accent);padding:2px 6px;border-radius:3px;opacity:0}
/* 18 nfc */
.rd{width:130px;height:150px;margin:-75px 0 0 -65px}
.rdb{position:absolute;inset:0;border-radius:16px;background:linear-gradient(160deg,#2c282f,#141216);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 1px 0 rgba(255,255,255,.25) inset}
.rdr{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;border:3px solid #3a353b;box-shadow:0 0 0 1px #000 inset}
.rdr.on{border-color:var(--hi);box-shadow:0 0 24px var(--accent),0 0 12px var(--accent) inset}
.wv{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid var(--hi);opacity:0}
.kc{position:absolute;left:50%;top:50%;width:92px;height:58px;margin:-29px 0 0 -46px;border-radius:7px;background:linear-gradient(135deg,#d8d2c8,#9d978d);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 18px rgba(0,0,0,.5);transform-style:preserve-3d}
.kc::before{content:"";position:absolute;left:10px;top:14px;width:16px;height:12px;border-radius:2px;background:linear-gradient(135deg,#f4d7a0,#a9822f)}
.kc::after{content:"";position:absolute;right:10px;bottom:8px;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px #e9e4da,inset 0 0 0 5px var(--accent)}
/* 19 bell */
.bell{width:120px;height:100px;margin:-50px 0 0 -60px}
.bb{position:absolute;left:0;right:0;bottom:0;height:20px;border-radius:50%;background:linear-gradient(180deg,#4a444c,#1c191e);box-shadow:0 8px 12px -4px #000}
.bd{position:absolute;left:12px;right:12px;bottom:12px;height:56px;border-radius:60px 60px 5px 5px;background:linear-gradient(100deg,#6a646d,#e8e2d8 30%,#8f8991 55%,#3a363c);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.bd::after{content:"";position:absolute;left:50%;top:-12px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#9d978d);box-shadow:0 0 0 1px #000}
.rp{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid var(--hi);opacity:0}
/* 20 stones */
.zen{width:140px;height:160px;margin:-80px 0 0 -70px}
.sn{position:absolute;left:50%;border-radius:50%;background:radial-gradient(ellipse at 36% 28%,#7a747c,#3a363c 55%,#1c191e);box-shadow:0 6px 8px rgba(0,0,0,.5)}
/* 21 calendar */
.cal{width:124px;height:132px;margin:-66px 0 0 -62px}
.pg{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#f1ece3,#ddd6ca);backface-visibility:hidden;transform-origin:50% 0;box-shadow:0 12px 18px -8px rgba(0,0,0,.6);overflow:hidden}
.pg .hd{height:34px;background:var(--accent);color:#fff;font:700 11px/34px var(--mono);letter-spacing:.2em;text-align:center}
.pg .dn{font:800 52px/84px var(--sans);text-align:center;color:#1c191e}
.pg svg{position:absolute;left:18px;top:42px;width:88px;height:70px}
.ring2{position:absolute;top:-6px;width:8px;height:16px;border-radius:4px;background:linear-gradient(90deg,#9d978d,#e8e2d8,#6a646d);z-index:9;transform:translateZ(6px)}
/* 22 radar */
.rad{width:150px;height:150px;margin:-75px 0 0 -75px}
.rdisc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.0) 0 17px,rgba(255,255,255,.16) 17px 18px),radial-gradient(circle,#1b181d,#0d0b0f);box-shadow:0 0 0 2px rgba(255,255,255,.2),0 0 0 6px rgba(0,0,0,.5)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(224,88,92,0) 0,rgba(224,88,92,.0) 270deg,rgba(224,88,92,.55) 358deg,rgba(255,200,200,.9) 360deg)}
.bl{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#4a444c}
.bl.on{background:var(--hi);box-shadow:0 0 10px var(--accent)}
.bl u{position:absolute;left:3px;bottom:4px;width:2px;height:0;background:linear-gradient(0deg,var(--hi),transparent);transform-origin:50% 100%;transform:rotateX(-90deg)}

.trig{display:none!important}
</style>

<div class="wrap">
  <h1>Click Loaders</h1>
  <p class="sub">Twenty-two loaders. Each one plays its own loading sequence on a loop, reaches done, then starts over. Every one is built in 3D and tilts with the mouse. Progress is a timed demo, not a real upload.</p>
  <div class="bar">
    <label>Accent <input id="acc" type="color" value="#8a2226"></label>
    <label>Duration <input id="dur" type="range" min="1.2" max="5" step="0.1" value="2.8"></label>
    <label>Mouse strength <input id="str" type="range" min="0" max="3" step="0.05" value="1.5"></label>
      </div>
  <div class="grid" id="grid"></div>
</div>
