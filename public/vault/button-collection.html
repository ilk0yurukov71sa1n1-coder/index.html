<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button Motion Collection</title>
<style>
:root{--bg:#f4f1ec;--ink:#17110f;--mut:#6d625c;--red:#c1121f;--line:rgba(23,17,15,.12);--tile:#fbf9f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 20px 80px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--mut);margin:0 0 20px;max-width:60ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.tabs button{border:1px solid var(--line);background:var(--tile);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--tile);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.stage{min-height:150px;display:grid;place-items:center;padding:18px;position:relative;overflow:hidden}
.meta{padding:10px 14px 12px;border-top:1px solid var(--line)}
.meta b{display:block;font-size:14px}.meta span{color:var(--mut);font-size:13px}
.todo{margin-top:26px;color:var(--mut);font-size:13px}
/* base buttons */
.b{font:600 14px system-ui;border:0;padding:12px 22px;border-radius:10px;cursor:pointer;background:var(--ink);color:#fff;position:relative;transition:transform .2s,box-shadow .2s,background .2s}
.b:active{transform:scale(.97)}
.b:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.red{background:var(--red)}
.s-dark{background:#0f0d0c;padding:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<h1>Button Motion Collection</h1>
<p class="lead">Live buttons you can hover, press and hold. This is the first batch, more groups follow. Tell Claude the names you want on a client page.</p>
<nav class="tabs" id="tabs" aria-label="Groups"></nav>
<div class="grid" id="grid"></div>
<p class="todo" id="todo"></p>
<script>
const R=[];const reg=(g,n,d,fn,dark)=>R.push({g,n,d,fn,dark});
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const btn=(label,cls='')=>el('button','b '+cls,label);

/* REWARDS */
reg('Rewards','Confetti Burst','Tap fast to build a combo',s=>{
  const b=btn('Tap me','red'),c=el('div');c.style.cssText='position:absolute;inset:0;pointer-events:none';
  let n=0,t;s.append(c,b);
  b.onclick=e=>{n++;b.textContent=n>1?'Combo x'+n:'Tap me';clearTimeout(t);t=setTimeout(()=>{n=0;b.textContent='Tap me'},900);
   const r=b.getBoundingClientRect(),o=s.getBoundingClientRect();
   for(let i=0;i<14+n*2;i++){const p=el('i');const a=Math.random()*6.28,d=40+Math.random()*60;
    p.style.cssText=`position:absolute;left:${r.left-o.left+r.width/2}px;top:${r.top-o.top+r.height/2}px;width:6px;height:10px;background:${['#c1121f','#17110f','#e8b4a0','#f4f1ec'][i%4]};border:1px solid rgba(0,0,0,.15)`;
    c.append(p);p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+30}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:800,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}}});
reg('Rewards','Morph Panel','Pill springs open into a menu',s=>{
  const w=el('div');w.style.cssText='background:var(--ink);color:#fff;border-radius:22px;overflow:hidden;width:120px;height:42px;transition:width .45s cubic-bezier(.3,1.4,.5,1),height .45s cubic-bezier(.3,1.4,.5,1),border-radius .3s;cursor:pointer';
  w.innerHTML='<div style="padding:11px 0;text-align:center;font:600 14px system-ui">Menu</div><div style="padding:4px 18px 16px;display:grid;gap:8px;font-size:14px"><span>Home</span><span>Work</span><span>Contact</span></div>';
  w.tabIndex=0;w.setAttribute('role','button');
  const tog=()=>{const o=w.dataset.o!=='1';w.dataset.o=o?'1':'';w.style.width=o?'200px':'120px';w.style.height=o?'150px':'42px';w.style.borderRadius=o?'16px':'22px'};
  w.onclick=tog;w.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}};s.append(w)});
reg('Rewards','Heart Pop','Like with rings, dots and counter',s=>{
  const b=btn('<span class="h">&#9825;</span> <span class="n">128</span>');let on=false,n=128;
  b.style.background='#fff';b.style.color='var(--ink)';b.style.border='1px solid var(--line)';s.append(b);
  b.onclick=()=>{on=!on;n+=on?1:-1;b.querySelector('.n').textContent=n;const h=b.querySelector('.h');h.innerHTML=on?'&#9829;':'&#9825;';h.style.color=on?'var(--red)':'';
   if(on){h.animate([{transform:'scale(.6)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});
    const ring=el('i');ring.style.cssText='position:absolute;left:14px;top:50%;width:18px;height:18px;margin:-9px;border:2px solid var(--red);border-radius:50%';b.append(ring);
    ring.animate([{transform:'scale(.5)',opacity:1},{transform:'scale(2.6)',opacity:0}],{duration:520}).onfinish=()=>ring.remove();
    for(let i=0;i<6;i++){const d=el('i');d.style.cssText='position:absolute;left:23px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--red)';b.append(d);const a=i*1.047;
     d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*22}px,${Math.sin(a)*22}px)`,opacity:0}],{duration:500}).onfinish=()=>d.remove()}}}});
reg('Rewards','Hold to Confirm','Charge it up, then it fires',s=>{
  const b=btn('Hold to confirm');b.style.overflow='hidden';const f=el('i');f.style.cssText='position:absolute;inset:0;background:var(--red);transform:scaleX(0);transform-origin:left';b.prepend(f);
  const lab=el('span');lab.style.position='relative';lab.textContent='Hold to confirm';b.childNodes.forEach(x=>{if(x.nodeType===3)x.remove()});b.append(lab);
  let a;const go=()=>{a=f.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:1100,fill:'forwards'});a.onfinish=()=>{lab.textContent='Confirmed';setTimeout(()=>{lab.textContent='Hold to confirm';f.style.transform='scaleX(0)';a.cancel()},1200)}};
  const stop=()=>{if(a&&a.playState==='running'){a.cancel()}};
  b.onpointerdown=go;b.onpointerup=b.onpointerleave=stop;s.append(b)});

/* STATE MORPHS */
reg('State morphs','Spinner to Check','Send, spin, success or error',s=>{
  const b=btn('Send');b.style.minWidth='130px';let busy=false,ok=true;s.append(b);
  b.onclick=()=>{if(busy)return;busy=true;b.innerHTML='<span style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px"></span>';
   setTimeout(()=>{b.innerHTML=ok?'&#10003; Sent':'&#10005; Failed';b.style.background=ok?'#1f7a44':'var(--red)';ok=!ok;
    setTimeout(()=>{b.textContent='Send';b.style.background='';busy=false},1300)},1000)};
  if(!document.getElementById('spk')){const k=el('style');k.id='spk';k.textContent='@keyframes sp{to{transform:rotate(360deg)}}';document.head.append(k)}});
reg('State morphs','Type-out Label','Label retypes itself, terminal style',s=>{
  const b=btn('','');b.style.cssText+=';font-family:ui-monospace,Menlo,monospace;min-width:190px;text-align:left';s.append(b);
  const L=['Deploy site','Deploying...','Live'];let i=0,busy=false;b.textContent=L[0];
  const type=(txt,cb)=>{let k=0;b.textContent='';const t=setInterval(()=>{b.textContent=txt.slice(0,++k)+'_';if(k>=txt.length){clearInterval(t);b.textContent=txt;cb&&cb()}},45)};
  b.onclick=()=>{if(busy)return;busy=true;type(L[1],()=>setTimeout(()=>type(L[2],()=>setTimeout(()=>type(L[0],()=>busy=false),900)),700))}});
reg('State morphs','Progress Fill','Download fills the button like water',s=>{
  const b=btn('','');b.style.cssText+=';overflow:hidden;min-width:170px;background:#fff;color:var(--ink);border:1px solid var(--line)';
  const f=el('i');f.style.cssText='position:absolute;left:0;right:0;bottom:0;height:0;background:var(--red)';const l=el('span');l.style.cssText='position:relative;mix-blend-mode:normal';l.textContent='Download';b.append(f,l);s.append(b);let busy=false;
  b.onclick=()=>{if(busy)return;busy=true;const a=f.animate([{height:'0%'},{height:'100%'}],{duration:1800,fill:'forwards',easing:'ease-in-out'});
   const t=setInterval(()=>{l.textContent=Math.round(parseFloat(getComputedStyle(f).height)/b.offsetHeight*100)+'%';l.style.color='#fff'},60);
   a.onfinish=()=>{clearInterval(t);l.textContent='Done';setTimeout(()=>{a.cancel();f.style.height=0;l.textContent='Download';l.style.color='';busy=false},1100)}}});
reg('State morphs','Paper Fold','Folds like paper to the next answer',s=>{
  const A=['Yes','Maybe','Not yet','Ask again'];let i=0;const b=btn(A[0]);b.style.cssText+=';min-width:130px;transform-style:preserve-3d;perspective:400px;transform-origin:center bottom';s.style.perspective='600px';s.append(b);
  b.onclick=()=>{b.animate([{transform:'rotateX(0)'},{transform:'rotateX(-90deg)'}],{duration:220,easing:'ease-in'}).onfinish=()=>{i=(i+1)%A.length;b.textContent=A[i];b.animate([{transform:'rotateX(90deg)'},{transform:'rotateX(0)'}],{duration:260,easing:'ease-out'})}}});

/* HOVER FEEL */
reg('Hover feel','Magnetic','Buttons pull toward your cursor',s=>{
  const mk=t=>{const b=btn(t);b.style.margin='6px';return b};const bs=[mk('One'),mk('Two'),mk('Three')];s.style.gridAutoFlow='column';s.style.gap='6px';s.append(...bs);
  s.onpointermove=e=>bs.forEach(b=>{const r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy);
   if(d<120){const k=(1-d/120)*.35;b.style.transform=`translate(${dx*k}px,${dy*k}px)`}else b.style.transform=''});
  s.onpointerleave=()=>bs.forEach(b=>b.style.transform='')});
reg('Hover feel','Liquid Blob','Gooey blob follows and splashes',s=>{
  const b=btn('Hover me');b.style.cssText+=';overflow:hidden;background:#fff;color:var(--ink);border:1px solid var(--line)';
  const blob=el('i');blob.style.cssText='position:absolute;width:90px;height:90px;border-radius:50%;background:var(--red);left:0;top:0;transform:translate(-50%,-50%) scale(0);transition:transform .35s cubic-bezier(.3,1.3,.5,1),left .15s,top .15s;filter:blur(1px);mix-blend-mode:multiply';
  b.append(blob);b.onpointermove=e=>{const r=b.getBoundingClientRect();blob.style.left=e.clientX-r.left+'px';blob.style.top=e.clientY-r.top+'px';blob.style.transform='translate(-50%,-50%) scale(1)'};
  b.onpointerleave=()=>blob.style.transform='translate(-50%,-50%) scale(0)';s.append(b)});
reg('Hover feel','Slot Roll','Letters roll, reels spin for a jackpot',s=>{
  const b=btn('');b.style.cssText+=';padding:0 20px;height:44px;overflow:hidden;display:inline-flex';const word='REWARD';
  [...word].forEach((ch,i)=>{const c=el('span');c.style.cssText='display:block;height:44px;overflow:hidden;position:relative;width:.85em;text-align:center';
   const in_=el('span','',ch+'<br>'+ch);in_.style.cssText=`display:block;line-height:44px;transition:transform .35s ${i*40}ms cubic-bezier(.3,1.2,.5,1)`;c.append(in_);b.append(c)});
  b.onpointerenter=()=>b.querySelectorAll('span>span').forEach(x=>x.style.transform='translateY(-44px)');
  b.onpointerleave=()=>b.querySelectorAll('span>span').forEach(x=>{x.style.transition='none';x.style.transform='';requestAnimationFrame(()=>x.style.transition='')});
  s.append(b)});
reg('Hover feel','Particle Swarm','Dots scatter and re-form new words',s=>{
  const cv=el('canvas');cv.width=260;cv.height=90;cv.style.cursor='pointer';s.append(cv);const x=cv.getContext('2d');const W=['HELLO','HOLD','OPEN'];let wi=0,P=[];
  const target=w=>{const t=document.createElement('canvas');t.width=260;t.height=90;const c=t.getContext('2d');c.font='700 44px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(w,130,48);
   const d=c.getImageData(0,0,260,90).data,pts=[];for(let y=0;y<90;y+=4)for(let q=0;q<260;q+=4)if(d[(y*260+q)*4+3]>128)pts.push([q,y]);return pts};
  let T=target(W[0]);P=T.map(p=>({x:Math.random()*260,y:Math.random()*90,tx:p[0],ty:p[1]}));
  cv.onclick=()=>{wi=(wi+1)%W.length;T=target(W[wi]);P.forEach((p,i)=>{const t=T[i%T.length];p.tx=t[0];p.ty=t[1]});while(P.length<T.length){const t=T[P.length];P.push({x:130,y:45,tx:t[0],ty:t[1]})}P.length=T.length;P.forEach(p=>{p.x+=(Math.random()-.5)*80;p.y+=(Math.random()-.5)*60})};
  let on=true;(function f(){x.clearRect(0,0,260,90);x.fillStyle='#17110f';P.forEach(p=>{p.x+=(p.tx-p.x)*.1;p.y+=(p.ty-p.y)*.1;x.fillRect(p.x,p.y,2.6,2.6)});if(on)requestAnimationFrame(f)})();
  new IntersectionObserver(e=>{const v=e[0].isIntersecting;if(v&&!on){on=true;requestAnimationFrame(function f2(){x.clearRect(0,0,260,90);x.fillStyle='#17110f';P.forEach(p=>{p.x+=(p.tx-p.x)*.1;p.y+=(p.ty-p.y)*.1;x.fillRect(p.x,p.y,2.6,2.6)});if(on)requestAnimationFrame(f2)})}else if(!v)on=false}).observe(cv)});

/* STYLE AND MOOD */
reg('Style and mood','Glitch','RGB split, scramble and screen tear',s=>{
  const b=btn('GLITCH');b.style.letterSpacing='.12em';s.append(b);const base='GLITCH';
  b.onpointerenter=()=>{let k=0;const t=setInterval(()=>{b.textContent=[...base].map(c=>Math.random()<.4?'#@%&?!'[Math.floor(Math.random()*6)]:c).join('');b.style.textShadow=`${Math.random()*4-2}px 0 #c1121f,${Math.random()*-4+2}px 0 #2a9d8f`;if(++k>10){clearInterval(t);b.textContent=base;b.style.textShadow=''}},45)}});
reg('Style and mood','Day / Night','Sun turns to moon, clouds to stars',s=>{
  let night=false;const t=el('button','','');t.setAttribute('aria-label','Toggle day or night');t.style.cssText='width:86px;height:42px;border-radius:21px;border:0;cursor:pointer;position:relative;background:#cfe3f0;transition:background .5s;overflow:hidden';
  const k=el('i');k.style.cssText='position:absolute;top:5px;left:5px;width:32px;height:32px;border-radius:50%;background:#f2b84b;box-shadow:inset -8px -4px 0 0 transparent;transition:left .5s cubic-bezier(.5,1.3,.5,1),background .5s,box-shadow .5s';
  const st=el('i');st.style.cssText='position:absolute;left:14px;top:12px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:12px 8px 0 #fff,22px -2px 0 #fff;opacity:0;transition:opacity .5s';
  const cl=el('i');cl.style.cssText='position:absolute;right:10px;bottom:6px;width:26px;height:10px;border-radius:8px;background:#fff;transition:transform .5s,opacity .5s';t.append(st,cl,k);s.append(t);
  t.onclick=()=>{night=!night;t.style.background=night?'#1c2230':'#cfe3f0';k.style.left=night?'49px':'5px';k.style.background=night?'#e8e4da':'#f2b84b';k.style.boxShadow=night?'inset -9px -3px 0 0 #c9c3b4':'';st.style.opacity=night?1:0;cl.style.transform=night?'translateY(20px)':'';cl.style.opacity=night?0:1}});
reg('Style and mood','Rocket Send','Button blasts off into space',s=>{
  const b=btn('Send &#128640;'.replace('&#128640;','&uarr;'),'red');b.style.minWidth='120px';s.append(b);let busy=false;
  b.onclick=()=>{if(busy)return;busy=true;b.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(6px)',opacity:1,offset:.15},{transform:'translateY(-150px)',opacity:0}],{duration:800,easing:'ease-in'}).onfinish=()=>{b.style.opacity=0;setTimeout(()=>{b.animate([{transform:'translateY(30px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:400}).onfinish=()=>{b.style.opacity=1;busy=false}},500)}}});

/* PROFESSIONAL SETS */
const set=(n,d,mk,dark)=>reg('Professional sets',n,d,s=>{s.style.gap='10px';s.style.gridAutoFlow='column';mk(s)},dark);
set('Dark Premium','SaaS-grade set with states and loading',s=>{
  s.style.background='#0f0d0c';const a=btn('Get started');a.style.cssText+=';background:linear-gradient(#2b2523,#17110f);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(255,255,255,.08)';
  const l=btn('Loading');l.style.cssText+=';background:#17110f;opacity:.8;box-shadow:0 0 0 1px rgba(255,255,255,.08)';l.innerHTML='<span style="display:inline-block;width:12px;height:12px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px"></span>Saving';
  if(!document.getElementById('spk')){const k=el('style');k.id='spk';k.textContent='@keyframes sp{to{transform:rotate(360deg)}}';document.head.append(k)}
  a.onpointerenter=()=>a.style.boxShadow='inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(193,18,31,.7),0 6px 22px rgba(193,18,31,.25)';a.onpointerleave=()=>a.style.boxShadow='inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(255,255,255,.08)';s.append(a,l)},true);
set('Soft UI','Soft raised and pressed-in buttons',s=>{
  s.style.background='#e6e2dc';const sh='6px 6px 12px #c9c5bf,-6px -6px 12px #fff',pr='inset 4px 4px 8px #c9c5bf,inset -4px -4px 8px #fff';
  ['Raised','Pressed'].forEach((t,i)=>{const b=btn(t);b.style.cssText+=`;background:#e6e2dc;color:var(--ink);box-shadow:${i?pr:sh}`;if(!i){b.onpointerdown=()=>b.style.boxShadow=pr;b.onpointerup=b.onpointerleave=()=>b.style.boxShadow=sh}s.append(b)})});
set('Glass','Frosted glass over a colour mesh',s=>{
  s.style.background='radial-gradient(circle at 20% 30%,#e9a99a,transparent 55%),radial-gradient(circle at 80% 70%,#f2d9b8,transparent 55%),#e8e2da';
  const b=btn('Glass');b.style.cssText+=';background:rgba(255,255,255,.35);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.08)';s.append(b)});
set('Editorial','Magazine-style wipe and underline',s=>{
  const b=btn('Read the story');b.style.cssText+=';background:transparent;color:var(--ink);border-radius:0;padding:10px 4px;border-bottom:1px solid var(--ink);overflow:hidden';
  const w=el('i');w.style.cssText='position:absolute;inset:0;background:var(--ink);transform:translateX(-101%);transition:transform .4s cubic-bezier(.7,0,.2,1)';const t=el('span');t.style.position='relative';t.textContent='Read the story';b.textContent='';b.append(w,t);
  b.onpointerenter=()=>{w.style.transform='none';t.style.color='#fff'};b.onpointerleave=()=>{w.style.transform='translateX(101%)';t.style.color='';setTimeout(()=>{w.style.transition='none';w.style.transform='translateX(-101%)';requestAnimationFrame(()=>w.style.transition='')},400)};s.append(b)});
set('Material','Ripple, tonal, elevated and FAB',s=>{
  const mk=(t,st)=>{const b=btn(t);b.style.cssText+=';overflow:hidden;'+st;b.onpointerdown=e=>{const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,i=el('i');i.style.cssText=`position:absolute;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:rgba(255,255,255,.35)`;b.append(i);i.animate([{transform:'scale(0)',opacity:1},{transform:'scale(1)',opacity:0}],{duration:600}).onfinish=()=>i.remove()};return b};
  s.append(mk('Filled','background:var(--red)'),mk('Elevated','background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2)'),mk('+','border-radius:50%;width:48px;height:48px;padding:0;font-size:22px;box-shadow:0 4px 10px rgba(0,0,0,.25)'))});
set('Capsule','Clean iOS-style capsules and switch',s=>{
  const c=btn('Continue');c.style.borderRadius='99px';const sw=el('button','','<i></i>');sw.setAttribute('role','switch');sw.setAttribute('aria-checked','false');sw.style.cssText='width:52px;height:30px;border-radius:15px;border:0;background:#d6d1ca;position:relative;cursor:pointer;transition:background .25s';
  sw.firstChild.style.cssText='position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s';
  sw.onclick=()=>{const o=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',o);sw.style.background=o?'#1f7a44':'#d6d1ca';sw.firstChild.style.left=o?'25px':'3px'};s.append(c,sw)});
set('Neo-brutalist','Hard shadows, bold colours',s=>{
  const b=btn('Press me');b.style.cssText+=';background:#ffd84a;color:#000;border:3px solid #000;border-radius:0;box-shadow:5px 5px 0 #000;transition:transform .1s,box-shadow .1s';
  b.onpointerdown=()=>{b.style.transform='translate(5px,5px)';b.style.boxShadow='0 0 0 #000'};b.onpointerup=b.onpointerleave=()=>{b.style.transform='';b.style.boxShadow='5px 5px 0 #000'};s.append(b)});
set('Gradient Border','Spinning gradient outline and glow',s=>{
  const w=el('span');w.style.cssText='display:inline-block;padding:2px;border-radius:12px;background:conic-gradient(from var(--a,0deg),#c1121f,#f2b84b,#17110f,#c1121f);animation:rot 3s linear infinite;box-shadow:0 0 20px rgba(193,18,31,.2)';
  if(!document.getElementById('rk')){const k=el('style');k.id='rk';k.textContent='@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}@keyframes rot{to{--a:360deg}}';document.head.append(k)}
  const b=btn('Gradient');b.style.cssText+=';background:#fff;color:var(--ink);border-radius:10px';w.append(b);s.append(w)});

const groups=[...new Set(R.map(r=>r.g))];const ALL=['All',...groups];
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid');
function show(g){grid.innerHTML='';[...tabs.children].forEach(t=>t.setAttribute('aria-pressed',t.textContent===g));
 R.filter(r=>g==='All'||r.g===g).forEach(r=>{const c=el('div','card'),s=el('div','stage'),m=el('div','meta',`<b>${r.n}</b><span>${r.d}</span>`);c.append(s,m);grid.append(c);try{r.fn(s)}catch(e){s.textContent='This one could not start.'}})}
ALL.forEach(g=>{const b=el('button','',g);b.onclick=()=>{show(g);history.replaceState(null,'','#'+encodeURIComponent(g))};tabs.append(b)});
const h=decodeURIComponent(location.hash.slice(1));show(ALL.includes(h)?h:'All');
document.getElementById('todo').textContent=R.length+' of 75 buttons are in. Still to come: Toy-like, Futuristic, Futuristic II, Fully 3D, Premium 3D, Ink family, Ink family II.';
</script></body></html>
