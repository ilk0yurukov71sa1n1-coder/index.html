<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo Loaders</title>
<style>
:root{--bg:#0b0a0b;--card:#131114;--line:rgba(255,255,255,.08);--fg:#efe9e1;--muted:#8d8680;--accent:#8a2226;--hi:#e0585c;--r:6px;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;max-width:64ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--fg);border-color:rgba(224,88,92,.6);background:#1a1215}
.stage{position:relative;height:min(64vh,520px);min-height:320px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(ellipse at 50% 120%,rgba(138,34,38,.18),transparent 62%),#0c0b0d;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;bottom:18px;display:grid;place-items:center;gap:10px;pointer-events:none}
.pct{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.pct i{font-style:normal;color:var(--muted)}
.bar{width:min(220px,60%);height:1px;background:rgba(255,255,255,.14)}
.bar b{display:block;height:1px;background:var(--hi);width:0}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:14px}
.ctl label{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.ctl input[type=range]{width:140px;accent-color:var(--accent)}
.note{color:var(--muted);margin:10px 2px 0;font-size:13px}
.err{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);padding:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Logo Loaders</h1>
  <p class="sub">Four loaders built from the Rollcfluence glass RC. The logo is turned into real 3D, so it has volume, reflections and answers the mouse. The progress here is a demo loop; use the slider to scrub it by hand.</p>
  <div class="tabs" id="tabs"></div>
  <div class="stage" id="stage">
    <div class="hud"><div class="bar"><b id="bar"></b></div><div class="pct" id="pct"></div></div>
    <div class="err" id="err">This loader needs WebGL. Try another browser or device.</div>
  </div>
  <p class="note" id="note"></p>
  <div class="ctl">
    <label>Speed <input id="spd" type="range" min="0.4" max="2" step="0.05" value="1"></label>
    <label>Mouse strength <input id="str" type="range" min="0" max="2" step="0.05" value="1"></label>
    <label><input id="man" type="checkbox"> Scrub by hand</label>
    <label>Progress <input id="prg" type="range" min="0" max="100" step="1" value="40"></label>
  </div>
</div>
<script type="module">
import * as THREE from './lib/three.module.js';

const stage = document.getElementById('stage');
const tabsEl = document.getElementById('tabs'), noteEl = document.getElementById('note'), pctEl = document.getElementById('pct'), barEl = document.getElementById('bar');
let SPD = 1, K = 1, MAN = false, MANV = 0.4;
document.getElementById('spd').oninput = (e) => (SPD = +e.target.value);
document.getElementById('str').oninput = (e) => (K = +e.target.value);
document.getElementById('man').onchange = (e) => (MAN = e.target.checked);
document.getElementById('prg').oninput = (e) => (MANV = +e.target.value / 100);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) { document.getElementById('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0, 8);

// studio light room for the glass and metal
function studioEnv() {
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x040404);
  const strip = (w, h, x, y, z, rx, ry, i, tint) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(tint ? tint[0] * i : i, tint ? tint[1] * i : i, tint ? tint[2] * i : i), side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); sc.add(m); };
  strip(12, 1.4, 0, 6, 1, Math.PI / 2, 0, 7);
  strip(1.2, 11, -6, 0, 1, 0, Math.PI / 2, 5);
  strip(1.2, 11, 6, 0, 1, 0, Math.PI / 2, 3.2, [1, 0.92, 0.86]);
  strip(9, 0.7, 0, -4, 3, -0.3, 0, 2.2, [1, 0.55, 0.5]);
  strip(5, 5, 0, 1, -6, 0, 0, 0.4);
  const pm = new THREE.PMREMGenerator(renderer); const t = pm.fromScene(sc, 0.03).texture; pm.dispose(); return t;
}
scene.environment = studioEnv();
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2, 3, 5); scene.add(key);

// ---- turn the logo into data ----
const N = 256;
const img = new Image();
img.src = '../logo-rc.png';
await new Promise((res, rej) => { img.onload = res; img.onerror = rej; }).catch(() => { document.getElementById('err').textContent = 'Could not load the logo image.'; document.getElementById('err').style.display = 'grid'; });
const cv = document.createElement('canvas'); cv.width = cv.height = N;
const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, N, N);
const px = cx.getImageData(0, 0, N, N).data;
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
const A = new Float32Array(N * N);
for (let i = 0; i < N * N; i++) A[i] = px[i * 4 + 3] / 255;
function blur(src, passes) {
  let a = Float32Array.from(src), b = new Float32Array(N * N);
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const x0 = Math.max(0, x - 1), x1 = Math.min(N - 1, x + 1); b[y * N + x] = (a[y * N + x0] + a[y * N + x] + a[y * N + x1]) / 3; }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const y0 = Math.max(0, y - 1), y1 = Math.min(N - 1, y + 1); a[y * N + x] = (b[y0 * N + x] + b[y * N + x] + b[y1 * N + x]) / 3; }
  }
  return a;
}
const Hb = blur(A, 14); let hmax = 0; for (let i = 0; i < Hb.length; i++) hmax = Math.max(hmax, Hb[i]);
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function heightAt(ix, iy) { const i = iy * N + ix; return Math.pow(Hb[i] / hmax, 0.78) * sstep(0.15, 0.6, A[i]); }

const SEG = 190;
function pillow(sign, depth) {
  const g = new THREE.PlaneGeometry(2, 2, SEG, SEG);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const ix = Math.min(N - 1, Math.max(0, Math.round(uv.getX(i) * (N - 1)))), iy = Math.min(N - 1, Math.max(0, Math.round((1 - uv.getY(i)) * (N - 1))));
    pos.setZ(i, sign * heightAt(ix, iy) * depth);
  }
  g.computeVertexNormals(); return g;
}
const glass = () => new THREE.MeshPhysicalMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.22, metalness: 0.35, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 1.25 });

// ---- modes ----
const SCALE = 1.9;
const modes = [];
const pointer = { x: 0, y: 0, tx: 0, ty: 0, h: 0, th: 0, wx: 0, wy: 0 };

function logoBody(depth, mat) {
  const g = new THREE.Group();
  const f = new THREE.Mesh(pillow(1, depth), mat), b = new THREE.Mesh(pillow(-1, depth), mat);
  g.add(f, b); g.userData.f = f; g.userData.b = b; g.scale.setScalar(SCALE); return g;
}
function tilt(group, t, extra) { const h = pointer.h * K; group.rotation.y = pointer.x * 0.75 * h + Math.sin(t * 0.0006) * 0.35 * (1 - pointer.h * 0.7) + (extra || 0); group.rotation.x = -pointer.y * 0.5 * h + Math.sin(t * 0.0005 + 1) * 0.08; }

// 1 Inflate
{
  const grp = new THREE.Group(); const body = logoBody(0.34, glass()); grp.add(body);
  modes.push({ id: 'inflate', name: 'Inflate', note: 'The glass logo starts as a flat sheet and fills out with volume as it loads. Move the mouse to turn it in the light.', group: grp,
    up(p, t, dt) { const e = p * p * (3 - 2 * p); const pulse = p >= 0.995 ? 1 + 0.04 * Math.sin(t * 0.012) : 1; body.scale.set(SCALE * pulse, SCALE * pulse, SCALE * (0.04 + 1.25 * e)); tilt(grp, t, 0); grp.position.y = 0.05 * Math.sin(t * 0.0012); } });
}
// 2 Slices
{
  const grp = new THREE.Group(); const S = 30; const planes = [];
  const g = new THREE.PlaneGeometry(2, 2);
  for (let i = 0; i < S; i++) { const m = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.3, metalness: 0.45, envMapIntensity: 1.2 }); const k = i / (S - 1); m.color.setScalar(0.45 + 0.55 * (1 - Math.abs(k - 0.5) * 1.4)); const p = new THREE.Mesh(g, m); p.scale.setScalar(SCALE); grp.add(p); planes.push(p); }
  modes.push({ id: 'slices', name: 'Slices', note: 'The logo is cut into thin layers that fan apart while loading and lock together when done. The mouse changes how far they spread.', group: grp,
    up(p, t) { const e = 1 - Math.pow(1 - p, 2); const spread = (0.5 * Math.sin(Math.min(1, p) * Math.PI) + 0.05) * (1 + pointer.h * K * 0.7); for (let i = 0; i < S; i++) { const k = i / (S - 1) - 0.5; planes[i].position.z = k * spread * 1.6; planes[i].visible = i / S <= p + 0.04; planes[i].position.x = Math.sin(t * 0.0012 + i * 0.5) * 0.02 * (1 - e); } tilt(grp, t, p * 1.2); } });
}
// 3 Particles
{
  const grp = new THREE.Group(); const pts = []; const target = [];
  for (let tries = 0; pts.length < 7200 && tries < 400000; tries++) { const ix = (Math.random() * N) | 0, iy = (Math.random() * N) | 0; const i = iy * N + ix; if (A[i] < 0.85) continue; const x = (ix / N - 0.5) * 2 * SCALE, y = (0.5 - iy / N) * 2 * SCALE, z = (Math.random() - 0.5) * 2 * heightAt(ix, iy) * 0.34 * SCALE * 0.7; target.push(x, y, z); pts.push([px[i * 4] / 255, px[i * 4 + 1] / 255, px[i * 4 + 2] / 255]); }
  const n = pts.length, geo = new THREE.BufferGeometry(), arr = new Float32Array(n * 3), col = new Float32Array(n * 3), start = new Float32Array(n * 3), delay = new Float32Array(n);
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) { c.setRGB(pts[i][0], pts[i][1], pts[i][2], THREE.SRGBColorSpace); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; const r = 2.6 + Math.random() * 2.2, th = Math.random() * 6.2832, ph = Math.acos(2 * Math.random() - 1); start[i * 3] = r * Math.sin(ph) * Math.cos(th); start[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th) * 0.7; start[i * 3 + 2] = r * Math.cos(ph); delay[i] = Math.random() * 0.45; }
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 2.6 * Math.min(window.devicePixelRatio || 1, 2), sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.95 });
  const pc = new THREE.Points(geo, mat); pc.frustumCulled = false; grp.add(pc);
  modes.push({ id: 'particles', name: 'Particles', note: 'Seven thousand points gather out of the dark and settle into the logo. Once it forms, your cursor pushes them aside and they return.', group: grp, noEnv: true,
    up(p, t) {
      const h = pointer.h * K; const R = 0.62, Rm = R * R;
      for (let i = 0; i < n; i++) {
        const q = Math.min(1, Math.max(0, (p - delay[i]) / 0.55)), e = q * q * (3 - 2 * q), sw = (1 - e) * 2.4;
        let sx = start[i * 3], sy = start[i * 3 + 1], sz = start[i * 3 + 2]; const cs = Math.cos(sw), sn = Math.sin(sw); const rx = sx * cs + sz * sn, rz = -sx * sn + sz * cs;
        let x = rx + (target[i * 3] - rx) * e, y = sy + (target[i * 3 + 1] - sy) * e, z = rz + (target[i * 3 + 2] - rz) * e;
        if (h > 0.01 && e > 0.8) { const dx = x - pointer.wx, dy = y - pointer.wy, d2 = dx * dx + dy * dy; if (d2 < Rm) { const f = (1 - d2 / Rm); const d = Math.sqrt(d2) + 1e-4; x += (dx / d) * f * f * 0.5 * h; y += (dy / d) * f * f * 0.5 * h; z += f * 0.5 * h; } }
        arr[i * 3] = x; arr[i * 3 + 1] = y; arr[i * 3 + 2] = z;
      }
      geo.attributes.position.needsUpdate = true; mat.opacity = 0.55 + 0.45 * Math.min(1, p * 3);
      grp.rotation.y = pointer.x * 0.45 * h + Math.sin(t * 0.0006) * 0.18 * (1 - pointer.h * 0.7); grp.rotation.x = -pointer.y * 0.3 * h;
    } });
}
// 4 Scan
{
  const grp = new THREE.Group(); const plane = new THREE.Plane(new THREE.Vector3(0, -1, 0), -2);
  const solid = glass(); solid.clippingPlanes = [plane]; solid.clipShadows = false;
  const body = logoBody(0.3, solid); grp.add(body);
  const ghostMat = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, wireframe: true, color: 0xe0585c, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
  const ghost = new THREE.Mesh(body.userData.f.geometry, ghostMat); ghost.scale.setScalar(SCALE); grp.add(ghost);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xff8a8e, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  const line = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 0.012), lineMat); scene.add(line); line.visible = false;
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 0.35), new THREE.MeshBasicMaterial({ color: 0xe0585c, transparent: true, opacity: 0.13, blending: THREE.AdditiveBlending, depthWrite: false })); line.add(glow);
  modes.push({ id: 'scan', name: 'Scan', note: 'A light line sweeps up the logo. Below it the logo is a red wire frame, above it it turns to polished glass.', group: grp,
    onShow() { line.visible = true; }, onHide() { line.visible = false; },
    up(p, t) { const y = -SCALE * 1.05 + p * SCALE * 2.1; plane.constant = y; line.position.set(0, y, 0.45); lineMat.opacity = p > 0.995 ? 0 : 0.9; glow.visible = p < 0.995; ghostMat.opacity = 0.42 * (1 - sstep(0.9, 1, p)) + 0.02; tilt(grp, t, 0); grp.updateMatrixWorld(); } });
}

let cur = 0;
modes.forEach((m, i) => { m.group.visible = false; scene.add(m.group); const b = document.createElement('button'); b.type = 'button'; b.textContent = m.name; b.onclick = () => show(i); tabsEl.appendChild(b); });
function show(i) {
  modes[cur].group.visible = false; modes[cur].onHide && modes[cur].onHide();
  cur = i; modes[cur].group.visible = true; modes[cur].onShow && modes[cur].onShow();
  noteEl.textContent = modes[cur].note;
  [].forEach.call(tabsEl.children, (b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  scene.environment = modes[cur].noEnv ? null : envTex;
}
const envTex = scene.environment;

// ---- pointer ----
function setP(e) { const r = stage.getBoundingClientRect(); pointer.tx = ((e.clientX - r.left) / r.width) * 2 - 1; pointer.ty = -(((e.clientY - r.top) / r.height) * 2 - 1); }
stage.addEventListener('pointerenter', (e) => { setP(e); if (pointer.h < 0.02) { pointer.x = pointer.tx; pointer.y = pointer.ty; } pointer.th = 1; });
stage.addEventListener('pointermove', (e) => { setP(e); pointer.th = 1; });
stage.addEventListener('pointerleave', () => { pointer.th = 0; });
stage.addEventListener('pointerdown', (e) => { setP(e); pointer.th = 1; });

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.position.z = 8 * Math.max(1, 0.9 / camera.aspect + 0.12); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

// ---- loop: fake progress 0..1 over 3.4s, hold, repeat ----
const LOAD = 3.4, HOLD = 1.1;
let clock = 0, last = performance.now(), visible = true;
new IntersectionObserver((en) => { visible = en[0].isIntersecting; }).observe(stage);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (visible && !document.hidden) {
    clock += dt * SPD;
    const cyc = clock % (LOAD + HOLD); let p = Math.min(1, cyc / LOAD);
    p = 1 - Math.pow(1 - p, 1.6) * 0.0 + 0; // linear base
    const ease = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    p = MAN ? MANV : (cyc >= LOAD ? 1 : ease(Math.min(1, cyc / LOAD)) * 0.92 + 0.08 * Math.min(1, cyc / LOAD));
    pointer.x += (pointer.tx - pointer.x) * 0.12; pointer.y += (pointer.ty - pointer.y) * 0.12; pointer.h += (pointer.th - pointer.h) * 0.1;
    // pointer to world (z=0 plane of the scene)
    const hh = Math.tan((camera.fov * Math.PI) / 360) * camera.position.z; pointer.wx = pointer.x * hh * camera.aspect; pointer.wy = pointer.y * hh;
    modes[cur].up(p, now, dt);
    const pct = Math.round(p * 100);
    pctEl.innerHTML = (p >= 1 ? 'Ready' : 'Loading') + ' <i>' + String(pct).padStart(3, '0') + '%</i>'; barEl.style.width = pct + '%';
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
show(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
