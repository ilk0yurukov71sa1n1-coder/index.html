<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0e;--panel:#111116;--line:#1f1f27;--mut:#7c7a8c;--ink:#ecebf2;--acc:#ffffff}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{display:grid;grid-template-columns:280px 1fr;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.brand{padding:22px 20px 14px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,#ff5d3a,#ffd23f,#2fe0c0,#7aa2ff,#c792ff,#ff5d3a);display:grid;place-items:center;font-weight:700;font-size:15px;color:#0b0b0e}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}.brand small{display:block;color:var(--mut);font-size:12px}
.search{margin:4px 16px 10px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line);background:#0c0c10;color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:#3a3a48}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
nav{overflow:auto;padding:0 10px 20px;flex:1}
.grp{display:flex;justify-content:space-between;align-items:baseline;padding:16px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d5b6c}
.grp span{letter-spacing:0;font-weight:500;text-transform:none}
.it{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:0;background:transparent;color:#bdbbc9;font:inherit;cursor:pointer;transition:background .15s,color .15s}
.it i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.it:hover{background:#18181f;color:#fff}.it.on{background:#1d1d26;color:#fff;box-shadow:inset 0 0 0 1px #2a2a36}
.it .new{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:999px;background:#2a2a36;color:#d9d7e6}
main{position:relative;display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line)}
.meta{min-width:0;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#14141a;color:#dddbe8;font:500 13px Inter,system-ui;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:#3a3a48;background:#1a1a22}.btn.icon{width:36px;padding:0;justify-content:center}
.btn.pri{background:#ecebf2;color:#0b0b0e;border-color:#ecebf2}.btn.pri:hover{background:#fff}
.stage{position:relative;padding:14px;min-height:0}
.frame{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(0,0,0,.8)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .35s}
iframe.ready{opacity:1}
.count{position:absolute;left:28px;bottom:26px;font:500 12px Inter;color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);backdrop-filter:blur(8px);padding:5px 10px;border-radius:999px;pointer-events:none;z-index:2}
body.fs{grid-template-columns:1fr}body.fs aside,body.fs .top{display:none}body.fs .stage{padding:0}body.fs .frame{border-radius:0}
.exit{display:none;position:fixed;top:14px;right:14px;z-index:9}body.fs .exit{display:inline-flex}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#ecebf2;color:#0b0b0e;padding:9px 16px;border-radius:999px;font-weight:500;font-size:13px;transition:.25s;pointer-events:none;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  aside,nav,main{min-width:0}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .brand,.search,.grp{display:none}
  nav{display:flex;gap:6px;overflow-x:auto;padding:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
  .it{width:auto;white-space:nowrap;flex:none;padding:7px 12px;background:#16161c}.it .new{display:none}
  .top{padding:10px 12px;gap:10px}.desc{display:none}h1{font-size:16px}.act .hide-m{display:none}
  .stage{padding:8px}.frame{border-radius:12px}.count{left:18px;bottom:16px}
}
</style></head><body>
<aside>
  <div class="brand"><div class="logo">Aa</div><div><b>Text Styles</b><small>23 live, interactive styles</small></div></div>
  <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search styles" aria-label="Search styles"></div>
  <nav id="nav"></nav>
</aside>
<main>
  <div class="top">
    <div class="meta"><div class="chip" id="chip"><i></i><span></span></div><h1 id="title"></h1><div class="desc" id="desc"></div></div>
    <div class="act">
      <button class="btn icon" id="prev" aria-label="Previous style" title="Previous (←)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="btn icon" id="next" aria-label="Next style" title="Next (→)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="btn hide-m" id="shuffle" title="Random style">Shuffle</button>
      <button class="btn hide-m" id="restart" title="Restart this style">Restart</button>
      <button class="btn icon" id="full" aria-label="Full screen" title="Full screen (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn pri" id="save" title="Download this style as its own HTML file"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span class="hide-m">Download</span></button>
    </div>
  </div>
  <div class="stage"><div class="frame"><iframe id="f" title="Text style preview" allow="fullscreen"></iframe></div><div class="count" id="count"></div></div>
</main>
<button class="btn exit" id="exit">Exit full screen</button>
<div class="toast" id="toast"></div>
<script>
const S=[{"id": "aurora-headline", "name": "Aurora Headline", "group": "Websites", "c": "#9d8cff", "desc": "A dark SaaS hero: words blur in and the last ones glow with a moving aurora.", "raw": "<!DOCTYPE html>\n<!--no-polish-->\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Aurora Headline<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--x:50%;--y:40%}\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{background:#07070a;color:#e9e8ee;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}\n  .grain{position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><\/filter><rect width='100%' height='100%' filter='url(%23n)'/><\/svg>\");z-index:5}\n  .glow{position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(40% 35% at var(--x) var(--y),rgba(120,90,255,.18),transparent 70%)}\n  .grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:64px 64px;\n    -webkit-mask:radial-gradient(60% 50% at 50% 30%,#000,transparent 75%);mask:radial-gradient(60% 50% at 50% 30%,#000,transparent 75%)}\n  nav.site{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:22px 28px}\n  .logo{display:flex;align-items:center;gap:10px;font:600 16px \"Inter Tight\";letter-spacing:-.01em}\n  .logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,#7c5cff,#2ad3ff,#ff6ad5,#7c5cff)}\n  .links{display:flex;gap:28px;font-size:14px;color:#a3a1b0}.links a{color:inherit;text-decoration:none}.links a:hover{color:#fff}\n  .navcta{font:500 13px Inter;padding:8px 14px;border-radius:999px;background:#fff;color:#0a0a0f;text-decoration:none}\n  .hero{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:9vh 28px 0;text-align:center}\n  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-size:13px;color:#c9c7d4;opacity:0;animation:up .8s .1s forwards}\n  .pill b{font-weight:500;padding:3px 9px;border-radius:999px;background:rgba(124,92,255,.18);color:#c7b8ff}\n  h1{font:700 clamp(44px,8.2vw,112px)/.98 \"Inter Tight\",sans-serif;letter-spacing:-.045em;margin:26px auto 0;max-width:13ch;cursor:default}\n  h1 .w{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(10px);animation:in 1s cubic-bezier(.2,.7,.2,1) forwards}\n  .aur{background:linear-gradient(100deg,#c9b8ff 0%,#7fe6ff 22%,#ff9ad9 44%,#ffd29a 60%,#9d8cff 80%,#c9b8ff 100%);background-size:250% 100%;padding-bottom:.14em;margin-bottom:-.14em;-webkit-background-clip:text;background-clip:text;color:transparent;animation:in 1s cubic-bezier(.2,.7,.2,1) forwards,flow 9s ease-in-out 1.2s infinite}\n  .spot{position:relative}\n  .spot::after{content:attr(data-t);position:absolute;inset:0;color:transparent;background:radial-gradient(120px 120px at var(--sx,-200px) var(--sy,-200px),rgba(255,255,255,.95),rgba(190,170,255,.6) 40%,transparent 70%);-webkit-background-clip:text;background-clip:text;pointer-events:none}\n  p.sub{max-width:560px;margin:24px auto 0;font-size:clamp(16px,1.6vw,19px);line-height:1.55;color:#9b99a8;opacity:0;animation:up .9s .9s forwards}\n  .ctas{display:flex;gap:12px;justify-content:center;margin-top:34px;opacity:0;animation:up .9s 1.1s forwards}\n  .b1{position:relative;font:500 15px Inter;padding:13px 22px;border-radius:12px;background:#fff;color:#0a0a0f;border:0;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 10px 40px -10px rgba(124,92,255,.7)}\n  .b2{font:500 15px Inter;padding:13px 22px;border-radius:12px;background:rgba(255,255,255,.04);color:#e9e8ee;border:1px solid rgba(255,255,255,.12);cursor:pointer}\n  .logos{display:flex;gap:44px;justify-content:center;margin-top:9vh;color:#55535f;font:600 15px \"Inter Tight\";letter-spacing:.02em;opacity:0;animation:up .9s 1.4s forwards;flex-wrap:wrap}\n  .edit{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:8px}\n  .edit input{font:14px Inter;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(20,20,26,.8);color:#fff;width:240px;outline:none;backdrop-filter:blur(10px)}\n  .edit button{font:500 13px Inter;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(20,20,26,.8);color:#fff;cursor:pointer}\n  @keyframes in{to{opacity:1;transform:none;filter:none}}\n  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n  @keyframes flow{0%,100%{background-position:0 0}50%{background-position:100% 0}}\n  @media (max-width:760px){.links{display:none}.logos{gap:22px;font-size:13px}.edit{left:12px;right:12px}.edit input{flex:1;width:auto}}\n<\/style>\n<\/head>\n<body>\n<div class=\"glow\"><\/div><div class=\"grid\"><\/div><div class=\"grain\"><\/div>\n<nav class=\"site\"><div class=\"logo\"><i><\/i>Arcline<\/div><div class=\"links\"><a href=\"#\">Product<\/a><a href=\"#\">Customers<\/a><a href=\"#\">Pricing<\/a><a href=\"#\">Docs<\/a><\/div><a class=\"navcta\" href=\"#\">Sign in<\/a><\/nav>\n<section class=\"hero\">\n  <div class=\"pill\">Arcline 3.0 is here <b>Read more \u2192<\/b><\/div>\n  <h1 id=\"h\"><\/h1>\n  <p class=\"sub\">The workspace that plans, writes and ships alongside your team. Fewer meetings, sharper releases, every single week.<\/p>\n  <div class=\"ctas\"><button class=\"b1\">Start for free<\/button><button class=\"b2\">Book a demo<\/button><\/div>\n  <div class=\"logos\"><span>NORTHFIELD<\/span><span>Lattice&nbsp;Co<\/span><span>MERIDIAN<\/span><span>oakline<\/span><span>VERSO<\/span><\/div>\n<\/section>\n<div class=\"edit\"><input id=\"inp\" value=\"Ship ideas at the speed of thought\" aria-label=\"Headline\"><button id=\"re\">Replay<\/button><\/div>\n<script>\nconst h=document.getElementById('h'),inp=document.getElementById('inp'),root=document.documentElement;\nfunction render(){const words=(inp.value||' ').split(/\\s+/);const hl=Math.max(0,words.length-2);\n  h.innerHTML=words.map((w,i)=>{const cls='w'+(i>=hl?' aur':'');return `<span class=\"${cls} spot\" data-t=\"${w.replace(/\"/g,'&quot;')}\" style=\"animation-delay:${.15+i*.08}s${i>=hl?`,${1.2+i*.08}s`:''}\">${w}<\/span>`}).join(' ')}\naddEventListener('pointermove',e=>{root.style.setProperty('--x',e.clientX/innerWidth*100+'%');root.style.setProperty('--y',e.clientY/innerHeight*100+'%');\n  h.querySelectorAll('.spot').forEach(s=>{const r=s.getBoundingClientRect();s.style.setProperty('--sx',e.clientX-r.left+'px');s.style.setProperty('--sy',e.clientY-r.top+'px')})});\nlet deb;inp.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,250)});document.getElementById('re').onclick=render;render();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "mask-reveal", "name": "Line Mask Reveal", "group": "Websites", "c": "#b5492b", "desc": "A studio site where each serif line rises out of a mask, plus a scroll reveal.", "raw": "<!DOCTYPE html>\n<!--no-polish-->\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Line Mask Reveal<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  html{scroll-behavior:smooth}\n  body{background:#f3f0ea;color:#16140f;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n  nav.site{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 4vw;font-size:14px;background:rgba(243,240,234,.8);backdrop-filter:blur(10px)}\n  nav.site .brand{font:400 22px Fraunces,serif;letter-spacing:-.02em}\n  nav.site .m{display:flex;gap:26px;color:#6f6a5f}\n  .hero{min-height:calc(100vh - 66px);display:flex;flex-direction:column;justify-content:flex-end;padding:0 4vw 7vh}\n  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8a8478;margin-bottom:3vh;overflow:hidden}\n  .eyebrow span{display:inline-block;transform:translateY(110%);animation:rise 1s .1s cubic-bezier(.7,0,.2,1) forwards}\n  h1{font:300 clamp(48px,9.4vw,150px)/.95 Fraunces,serif;letter-spacing:-.035em;font-variation-settings:\"opsz\" 144}\n  .ln{display:block;overflow:hidden;padding-bottom:.06em}\n  .ln>span{display:inline-block;transform:translateY(105%) rotate(4deg);transform-origin:0 100%;animation:rise 1.25s cubic-bezier(.7,0,.2,1) forwards}\n  h1 em{font-style:italic;color:#b5492b}\n  .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:5vh;gap:30px;flex-wrap:wrap}\n  .row p{max-width:420px;line-height:1.6;color:#5c574d;opacity:0;animation:fade 1s 1.2s forwards}\n  .scroll{display:flex;align-items:center;gap:12px;font-size:13px;color:#6f6a5f;opacity:0;animation:fade 1s 1.4s forwards}\n  .scroll i{width:1px;height:44px;background:#16140f;transform-origin:top;animation:line 1.8s ease-in-out infinite}\n  section.more{padding:16vh 4vw;border-top:1px solid #ddd6c9}\n  section.more h2{font:300 clamp(36px,6vw,92px)/1 Fraunces,serif;letter-spacing:-.03em;max-width:16ch}\n  section.more h2 .ln>span{animation:none;transition:transform 1.2s cubic-bezier(.7,0,.2,1)}\n  section.more.in h2 .ln>span{transform:none}\n  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:4vw;margin-top:8vh}\n  .cols div{opacity:0;transform:translateY(20px);transition:1s cubic-bezier(.2,.7,.2,1)}\n  section.more.in .cols div{opacity:1;transform:none}\n  .cols b{display:block;font:400 22px Fraunces,serif;margin-bottom:10px}.cols p{color:#6f6a5f;line-height:1.6;font-size:15px}\n  .edit{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:8px}\n  .edit input{font:14px Inter;padding:9px 12px;border-radius:999px;border:1px solid #d8d0c1;background:rgba(255,255,255,.8);width:280px;outline:none}\n  .edit button{font:500 13px Inter;padding:9px 14px;border-radius:999px;border:0;background:#16140f;color:#f3f0ea;cursor:pointer}\n  @keyframes rise{to{transform:none}}@keyframes fade{to{opacity:1}}@keyframes line{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}\n  @media (max-width:760px){nav.site .m{display:none}.cols{grid-template-columns:1fr}.edit{left:12px;right:12px}.edit input{flex:1;width:auto}}\n<\/style>\n<\/head>\n<body>\n<nav class=\"site\"><span class=\"brand\">Fieldnote<\/span><span class=\"m\"><span>Work<\/span><span>Studio<\/span><span>Journal<\/span><span>Contact<\/span><\/span><\/nav>\n<section class=\"hero\">\n  <div class=\"eyebrow\"><span>Independent design studio \u2014 Est. 2014<\/span><\/div>\n  <h1 id=\"h\"><\/h1>\n  <div class=\"row\"><p>We help thoughtful companies tell their story through identity, editorial and digital work that lasts longer than a trend.<\/p><div class=\"scroll\"><i><\/i>Scroll to explore<\/div><\/div>\n<\/section>\n<section class=\"more\" id=\"more\">\n  <h2><span class=\"ln\"><span>Quiet work,<\/span><\/span><span class=\"ln\"><span style=\"transition-delay:.12s\">loud <em style=\"font-style:italic;color:#b5492b\">results.<\/em><\/span><\/span><\/h2>\n  <div class=\"cols\"><div><b>Identity<\/b><p>Names, marks and systems built to hold up at any size and in any room.<\/p><\/div><div style=\"transition-delay:.15s\"><b>Editorial<\/b><p>Books, reports and magazines with typography that rewards a slow read.<\/p><\/div><div style=\"transition-delay:.3s\"><b>Digital<\/b><p>Sites and products that move with purpose and load in a blink.<\/p><\/div><\/div>\n<\/section>\n<div class=\"edit\"><input id=\"inp\" value=\"Design that / feels *inevitable.*\" aria-label=\"Headline, use / for a new line and *stars* for italics\"><button id=\"re\">Replay<\/button><\/div>\n<script>\nconst h=document.getElementById('h'),inp=document.getElementById('inp');\nfunction render(){const lines=(inp.value||' ').split('/').map(s=>s.trim());\n  h.innerHTML=lines.map((l,i)=>`<span class=\"ln\"><span style=\"animation-delay:${.25+i*.12}s\">${l.replace(/[<>]/g,'').replace(/\\*(.+?)\\*/g,'<em>$1<\/em>')}<\/span><\/span>`).join('')}\nlet deb;inp.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,250)});document.getElementById('re').onclick=()=>{h.innerHTML='';requestAnimationFrame(render)};render();\nnew IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.25}).observe(document.getElementById('more'));\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "word-rotator", "name": "Word Rotator", "group": "Websites", "c": "#635bff", "desc": "A payments hero whose last word rotates, with live stat counters.", "raw": "<!DOCTYPE html>\n<!--no-polish-->\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Word Rotator Headline<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{background:#fbfbfd;color:#0c1222;font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}\n  .bg{position nst rot=document.getElementById('rot'),inp=document.getElementById('inp');let words=[],i=0,timer;const DUR=2600;rot.style.setProperty('--dur',DUR+'ms');\nconst meas=document.createElement('span');meas.style.cssText='position:absolute;visibility:hidden;white-space:nowrap';document.querySelector('h1').append(meas);\nfunction setup(){words=inp.value.split(',').map(s=>s.trim()).filter(Boolean);if(!words.length)words=[' '];rot.innerHTML='';\n  words.forEach((w,k)=>{const s=document.createElement('span');s.textContent=w;s.className=k?'wait':'';rot.append(s)});i=0;size();clearInterval(timer);timer=setInterval(next,DUR)}\nfunction size(){meas.textContent=words[i];rot.style.width=meas.getBoundingClientRect().width+'px'}\nfunction next(){const S=rot.children;S[i].className='out';const prev=i;i=(i+1)%words.length;S[i].className='wait';void S[i].offsetWidth;S[i].className='';size();setTimeout(()=>{if(S[prev]&&prev!==i)S[prev].className='wait'},700)}\nfunction count(el,to,fmt,d=1600){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,4);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(f)})(t0)}\ncount(document.getElementById('s1'),2.4,v=>v.toFixed(1)+'B');count(document.getElementById('s2'),99.999,v=>v.toFixed(3)+'%');count(document.getElementById('s3'),46,v=>Math.round(v));\nlet deb;inp.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(setup,300)});addEventListener('resize',size);document.fonts.ready.then(setup);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "kinetic-marquee", "name": "Kinetic Marquee", "group": "Websites", "c": "#ff4d1a", "desc": "Giant moving type rows. Drag or scroll to push them faster.", "raw": "<!DOCTYPE html>\n<!--no-polish-->\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Kinetic Marquee<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family= 14,-boost*o.dir*1.6));o.el.style.transform=`translateX(${o.x}px) skewX(${skew}deg)`}\n  document.getElementById('spd').textContent=boost>1?`Speed \u00d7${(1+boost).toFixed(1)}`:'Drag or scroll to push it';\n  requestAnimationFrame(loop)}\naddEventListener('wheel',e=>{boost=Math.max(-20,Math.min(20,boost+e.deltaY*.02))},{passive:true});\naddEventListener('pointerdown',e=>{if(e.target.closest('.edit,.b'))return;dragX=e.clientX});addEventListener('pointermove',e=>{if(dragX===null)return;boost=Math.max(-20,Math.min(20,boost+(e.clientX-dragX)*-.05));dragX=e.clientX});addEventListener('pointerup',()=>dragX=null);\nlet deb;inp.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(build,300)});document.fonts.ready.then(build);build();loop();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "annotate-draw", "name": "Hand-drawn Notes", "group": "Websites", "c": "#e0442e", "desc": "Marker circles, underlines and boxes draw themselves over key words.", "raw": "<!DOCTYPE html>\n<!--no-polish-->\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Hand-drawn Annotations<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Caveat:wght@600&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{background:#fffdf7;color:#1a1814;font-family:\"Bricolage Grotesque\",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}\n  body::before{content:\"\";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#e9e3d3 1px,transparent 1px);background-size:22px 22px;opacity:.7}\n  nav.site{position:relative;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:22px 28px;font-weight:500;font-size:15px}\n  nav.site b{font-weight:800;font- s=\"hero\">\n  <h1 id=\"h\">Write docs your team <span class=\"mk\" data-k=\"circle\">actually<\/span> reads, <span class=\"mk\" data-k=\"under\">without<\/span> the <span class=\"mk\" data-k=\"strike\">busywork<\/span> <span class=\"mk\" data-k=\"box\">overhead.<\/span><\/h1>\n  <p class=\"sub\">Quill turns rough notes into clear, shareable pages in seconds. Click any marked word to redraw it, or pick a pen below.<\/p>\n  <div class=\"ctas\"><button class=\"b1\">Try Quill free<\/button><button class=\"b2\">See examples<\/button><\/div>\n<\/section>\n<div class=\"tools\" id=\"tools\"><button class=\"on\" data-k=\"all\">Draw all<\/button><button data-k=\"circle\">Circle<\/button><button data-k=\"under\">Underline<\/button><button data-k=\"highlight\">Highlight<\/button><button data-k=\"box\">Box<\/button><button data-k=\"strike\">Strike<\/button><\/div>\n<script>\nconst NS='http://www.w3.org/2000/svg';const COL={circle:'#e0442e',under:'#2f6bff',strike:'#e0442e',box:'#1a1814',highlight:'#ffd84d'};\nfunction rnd(a){return (Math.random()-.5)*a}\nfunction pathFor(k,w,h){const j=Math.max(2,h*.06);\n  if(k==='under'){let d=`M${-4+rnd(j)} ${h*1.02+rnd(j)} `;d+=`Q${w*.5} ${h*1.12+rnd(j)} ${w+6} ${h*1.0+rnd(j)}`;d+=` M${w*.08} ${h*1.12+rnd(j)} Q${w*.55} ${h*1.2} ${w*.94} ${h*1.1+rnd(j)}`;return d}\n  if(k==='strike'){return `M${-6} ${h*.58+rnd(j)} C${w*.3} ${h*.5+rnd(j)} ${w*.7} ${h*.66+rnd(j)} ${w+8} ${h*.52+rnd(j)}`}\n  if(k==='box'){const p=8;return `M${-p+rnd(j)} ${-p*.4+rnd(j)} L${w+p+rnd(j)} ${-p*.6+rnd(j)} L${w+p*.8+rnd(j)} ${h+p*.6+rnd(j)} L${-p*.7+rnd(j)} ${h+p*.4+rnd(j)} Z`}\n  if(k==='highlight'){return `M${-4} ${h*.62} L${w+4} ${h*.6+rnd(j)}`}\n  // circle: two loose loops\n  const cx=w/2,cy=h*.55,rx=w/2+h*.1,ry=h*.62;let d='';for(let t=0;t<=Math.PI*2.25;t+=.18){const r=1+rnd(.06);const x=cx+Math.cos(t-2.1)*rx*r,y=cy+Math.sin(t-2.1)*ry*r;d+=(t?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '}return d}\nfunction draw(el,k,delay=0){el.querySelectorAll('svg').forEach(s=>s.remove());const w=el.offsetWidth,h=el.offsetHeight;const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',w);svg.setAttribute('height',h);svg.style.left=0;svg.style.top=0;\n  const p=document.createElementNS(NS,'path');p.setAttribute('d',pathFor(k,w,h));p.style.stroke=COL[k];p.style.strokeWidth=k==='highlight'?h*.5:Math.max(3,h*.06);if(k==='highlight'){p.style.opacity=.55;svg.style.zIndex=-1;p.style.strokeLinecap='butt'}\n  svg.append(p);el.prepend(svg);const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;\n  p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:k==='circle'?900:600,delay,easing:'cubic-bezier(.6,.05,.3,1)',fill:'forwards'})}\nconst marks=[...document.querySelectorAll('.mk')];\nfunction all(){marks.forEach((m,i)=>draw(m,m.dataset.k,300+i*450))}\nmarks.forEach(m=>m.addEventListener('click',()=>draw(m,m.dataset.k)));\ndocument.getElementById('tools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tools button').forEach(x=>x.classList.toggle('on',x===b));\n  if(b.dataset.k==='all')return all();marks.forEach((m,i)=>{m.dataset.k=b.dataset.k;draw(m,b.dataset.k,i*200)})});\naddEventListener('resize',()=>marks.forEach(m=>draw(m,m.dataset.k)));\ndocument.fonts.ready.then(all);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "scroll-highlight", "name": "Scroll Highlight", "group": "Websites", "c": "#ff5e7e", "desc": "A product page where the paragraph lights up word by word as you scroll.", "raw": "<!DOCTYPE html>\n<!--no-polish-->\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Scroll Highlight Text<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  body{background:#000;color:#f5f5f7;fo  .end h2{font-size:clamp(32px,5vw,64px);letter-spacing:-.03em}\n  .end button{font:600 17px \"Inter Tight\";padding:12px 24px;border-radius:999px;border:0;background:#0071e3;color:#fff;cursor:pointer}\n  .edit{position:fixed;right:18px;bottom:18px;z-index:7;display:flex;gap:8px}\n  .edit textarea{font:13px \"Inter Tight\";padding:10px 12px;border-radius:12px;border:1px solid #333;background:rgba(28,28,30,.9);color:#f5f5f7;width:320px;height:64px;resize:none;outline:none}\n  .auto{font:600 12px \"Inter Tight\";padding:8px 12px;border-radius:999px;border:1px solid #333;background:rgba(28,28,30,.9);color:#f5f5f7;cursor:pointer;align-self:flex-end}\n  @media (max-width:760px){nav.site{gap:18px}.edit{left:12px;right:12px}.edit textarea{flex:1;width:auto}}\n<\/style>\n<\/head>\n<body>\n<div class=\"bar\" id=\"bar\"><\/div>\n<nav class=\"site\"><b>Lumora<\/b><span>Overview<\/span><span>Design<\/span><span>Camera<\/span><span>Battery<\/span><span>Buy<\/span><\/nav>\n<section class=\"intro\"><small>New<\/small><h1>Lumora One.<br>Light, rethought.<\/h1><p><i><\/i>Scroll to read<\/p><\/section>\n<section class=\"track\" id=\"track\"><div class=\"sticky\"><p class=\"copy\" id=\"copy\"><\/p><\/div><\/section>\n<section class=\"end\"><h2>See it for yourself.<\/h2><button>Book a demo<\/button><\/section>\n<div class=\"edit\"><textarea id=\"inp\" aria-label=\"Paragraph, wrap key words in *stars*\">Every surface is milled from a single block of recycled aluminium. The display reaches *2,000 nits* outdoors, the battery lasts *two full days*, and the whole thing weighs less than a paperback. It is the most *considered* device we have ever made.<\/textarea><button class=\"auto\" id=\"auto\">Auto-play<\/button><\/div>\n<script>\nconst copy=document.getElementById('copy'),track=document.getElementById('track'),inp=document.getElementById('inp'),bar=document.getElementById('bar');let W=[],auto=null;\nfunction build(){const words=inp.value.trim().split(/\\s+/);copy.innerHTML='';W=words.map(w=>{const k=/^\\*.*\\*[.,!?]*$/.test(w)||w.startsWith('*')||w.endsWith('*')||/\\*[.,!?]$/.test(w);const s=document.createElement('span');s.textContent=w.replace(/\\*/g,'')+' ';if(/\\*/.test(w))s.classList.add('k');copy.append(s);return s});\n  // keep multi-word *phrases* highlighted together\n  let open=false;words.forEach((w,i)=>{if(w.startsWith('*'))open=true;if(open)W[i].classList.add('k');if(/\\*[.,!?]*$/.test(w)&&!(w.startsWith('*')&&w.length===1))open=false});update()}\nfunction update(){const r=track.getBoundingClientRect(),total=track.offsetHeight-innerHeight;const k=Math.max(0,Math.min(1,-r.top/total));const n=Math.round(k*W.length*1.05);W.forEach((s,i)=>s.classList.toggle('on',i<n));\n  const all=document.documentElement.scrollHeight-innerHeight;bar.style.width=(scrollY/all*100)+'%'}\naddEventListener('scroll',update,{passive:true});addEventListener('resize',update);\nlet deb;inp.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(build,300)});\ndocument.getElementById('auto').onclick=e=>{if(auto){cancelAnimationFrame(auto);auto=null;e.target.textContent='Auto-play';return}e.target.textContent='Stop';\n  const start=performance.now(),from=0,to=document.documentElement.scrollHeight-innerHeight;scrollTo(0,0);(function f(t){const k=Math.min(1,(t-start)/9000);scrollTo(0,from+(to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2));if(k<1)auto=requestAnimationFrame(f);else{auto=null;e.target.textContent='Auto-play'}})(start)};\nbuild();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "variable-wave", "name": "Variable Weight", "group": "Pro", "c": "#e8492b", "desc": "A variable font whose weight and width follow you.", "raw": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Variable Weight Text<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%;overflow:hidden}\n  body{background:#efece6;color:#141414;font-family:\"Roboto Flex\",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto}\n  header{padding:18px 26px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-variation-settings:\"wght\" 500;color:#6a675f}\n  .stage{display:flex;align-items:center;justify-content:center;padding:0 3vw}\n  .line{display:flex;justify-content:center;white-space:pre;line-height:.9;text-transform:uppercase;user-select:none}\n  .l{display:inline-block;font-variation-settings:\"wght\" 400,\"wdth\" 100,\"opsz\" 144}\n  .acc{color:#e8492b}\n  footer{padding:18px;display:flex;justify-content:center;gap:10px;align-items:center}\n  input{font:500 15px \"Roboto Flex\";letter-spacing:.04em;padding:11px 0;border:0;border-bottom:2px solid #141414;background:transparent;width:260px;outline:none;text-transform:uppercase}\n  .seg{display:flex;border:1.5px solid #141414;border-radius:999px;overflow:hidden}\n  .seg button{font:600 12px \"Roboto Flex\";letter-spacing:.08em;padding:9px 14px;border:0;background:transparent;cursor:pointer;text-transform:uppercase}\n  .seg button.on{background:#141414;color:#efece6}\n<\/style>\n<\/head>\n<body>\n<header><span>Variable Weight \u00b7 typography<\/span><span>move across the letters<\/span><\/header>\n<div class=\"stage\"><div id=\"wrap\"><div class=\"line\" id=\"line\"><\/div><\/div><\/div>\n<footer><input id=\"inp\" value=\"Elastic Type\" maxlength=\"16\" aria-label=\"Your text\"><div class=\"seg\" id=\"mode\"><button class=\"on\" data-m=\"hover\">Hover<\/button><button data-m=\"wave\">Wave<\/button><button data-m=\"breathe\">Breathe<\/button><\/div><\/footer>\n<script>\nconst line=document.getElementById('line'),inp=document.getElementById('inp');let L=[],mode='hover',mx=-9999,my=-9999,fs=100;\nfunction build(){con w.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,n=AC.sampleRate*.012,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);\n  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*900;const g=AC.createGain();g.gain.value=.25;s.connect(f).connect(g).connect(AC.destination);s.start(t)}\nlet lastClick=0;function tick(){const n=performance.now();if(n-lastClick>18){lastClick=n;click()}}\nfunction layout(){\n  const vw=innerWidth,vh=innerHeight;COLS=vw<520?9:vw<900?12:16;\n  const cw=Math.min(64,Math.floor((vw*.92-44-(COLS-1)*5)/COLS)),chh=Math.round(cw*1.45);\n  document.documentElement.style.setProperty('--cw',cw+'px');document.documentElement.style.setProperty('--ch',Math.min(chh,(vh-260)/ROWS)+'px');\n  rowsEl.innerHTML='';cells=[];\n  for(let r=0;r<ROWS;r++){const row=document.createElement('div');row.className='row';for(let c=0;c<COLS;c++){const el=document.createElement('div');el.className='cell';\n    el.innerHTML='<div class=\"h t\"><span> <\/span><\/div><div class=\"h b\"><span> <\/span><\/div><div class=\"h t ft\"><span> <\/span><\/div><div class=\"h b fb\"><span> <\/span><\/div>';\n    const cell={el,cur:' ',target:' ',busy:false,q:el.querySelectorAll('span')};el.onclick=()=>{cell.target=CH[1+Math.random()*(CH.length-1)|0];run(cell)};cells.push(cell);row.append(el)}rowsEl.append(row)}\n  show(inp.value)}\nfunction wrap(msg){const lines=msg.toUpperCase().split('/').map(s=>s.trim());const out=[];for(const l of lines){let line='';for(const w of l.split(/\\s+/)){if(!w)continue;if((line+' '+w).trim().length>COLS){out.push(line);line=w.slice(0,COLS)}else line=(line+' '+w).trim()}out.push(line)}\n  return out.slice(0,ROWS).map(l=>{const pad=Math.floor((COLS-l.length)/2);return (' '.repeat(Math.max(0,pad))+l).padEnd(COLS,' ').slice(0,COLS)})}\nfunction show(msg){const ngth=\"18\" aria-label=\"Your text\"><div class=\"sw\" id=\"sw\"><\/div><label>Wind <input id=\"wind\" type=\"range\" min=\"0\" max=\"100\" value=\"35\"><\/label><\/div>\n<script>\nconst cv=document.getElementById('c'),inp=document.getElementById('inp'),windEl=document.getElementById('wind');\nlet ctx,W,H,tex,CW=28,CHH=12,pts=[],cons=[],bw,bh,ox,oy,drag=null,theme=0;\nconst THEMES=[['#b3122e','#f7e7c6'],['#14213d','#fca311'],['#0b3d2e','#e9f5db'],['#f4f1ea','#1d1d1d']];\nTHEMES.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c[0];b.ariaLabel='Banner colour';b.onclick=()=>{theme=i;paint()};document.getElementById('sw').append(b)});\nfunction size(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight;build()}\nfunction paint(){const [bg,fg]=THEMES[theme];tex=document.createElement('canvas');tex.width=bw*2;tex.height=bh*2;const c=tex.getContext('2d');c.scale(2,2);\n  c.fillStyle=bg;c.fillRect(0,0,bw,bh);\n  for(let y=0;y<bh;y+=3){c.fillStyle=`rgba(255,255,255,${Math.random()*.035})`;c.fillRect(0,y,bw,1)}for(let x=0;x<bw;x+=3){c.fillStyle=`rgba(0,0,0,${Math.random()*.035})`;c.fillRect(x,0,1,bh)}\n  c.strokeStyle=fg;c.globalAlpha=.85;c.lineWidth=2;c.setLineDash([7,5]);c.strokeRect(14,14,bw-28,bh-28);c.setLineDash([]);c.globalAlpha=1;\n  const t=inp.value||' ';let fs=bh*.42;c.font=`${fs}px \"DM Serif Display\", Georgia, serif`;const w=c.measureText(t).width;if(w>bw*.84){fs*=bw*.84/w;c.font=`${fs}px \"DM Serif Display\", Georgia, serif`}\n  c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.fillText(t,bw/2,bh/2+fs*.04);\n  c.font=`500 ${Math.max(10,bh*.06)}px Inter`;c.globalAlpha=.8;c.fillText('\u2605  EST. 2026  \u2605',bw/2,bh*.82);c.globalAlpha=1}\nfunction build(){bw=Math.min(W*.82,1000);bh=Math.min(H*.42,bw*.42);ox=(W-bw)/2;oy=H*.16;pts=[];cons=[];\n  for(let j=0;j<=CHH;j++)for(let i=0;i<=CW;i++){const x=ox+i*bw/CW,y n  for(const x of [ox-34,ox+bw+26]){ctx.fillStyle='#c9a24a';ctx.beginPath();ctx.arc(x+4,oy-7,9,0,6.28);ctx.fill()}\n  // soft shadow on the wall\n  ctx.fillStyle='rgba(30,40,50,.12)';ctx.filter='blur(18px)';ctx.beginPath();const last=pts.slice(-CW-1);ctx.moveTo(ox,oy+20);for(const p of last)ctx.lineTo(p.x+18,p.y+30);ctx.lineTo(ox+bw,oy+20);ctx.fill();ctx.filter='none';\n  const id=(i,j)=>j*(CW+1)+i;\n  for(let j=0;j<CHH;j++)for(let i=0;i<CW;i++){const a=pts[id(i,j)],b=pts[id(i+1,j)],c=pts[id(i,j+1)],d=pts[id(i+1,j+1)];\n    // shade by how the quad is tilted/compressed\n    const nx=(b.y-a.y)/(bw/CW),stretch=Math.hypot(b.x-a.x,b.y-a.y)/(bw/CW);const l=(nx*1.4)+(1-stretch)*2.2;\n    const shade=l>0?`rgba(0,0,0,${Math.min(.45,l*.5)})`:`rgba(255,255,255,${Math.min(.25,-l*.35)})`;\n    tri(a,b,d,null);tri(a,d,c,null);ctx.fillStyle=shade;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.fill()}\n  for(const p of pts)if(p.pin){ctx.fillStyle='#2b2118';ctx.beginPath();ctx.arc(p.x,p.y-3,4,0,6.28);ctx.fill()}}\nfunction loop(t){step(t);draw();requestAnimationFrame(loop)}\ncv.addEventListener('pointerdown',e=>{let best=null,bd=1e9;for(const p of pts){const d=Math.hypot(p.x-e.clientX,p.y-e.clientY);if(d<bd){bd=d;best=p}}if(bd<60){drag={p:best};cv.setPointerCapture(e.pointerId)}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;drag.p.px=drag.p.x;drag.p.py=drag.p.y;drag.p.x=e.clientX;drag.p.y=e.clientY});\ncv.addEventListener('pointerup',()=>drag=null);\ninp.addEventListener('input',paint);addEventListener('resize',size);\ndocument.fonts.load('40px \"DM Serif Display\"').then(size,size);size();requestAnimationFrame(loop);\n<\/script>\n\n\n\n<!--pro-polish-->\n<style id=\"pro-polish\">\n  header,.ui.top{flex-wrap:nowrap!important;gap:12px}\n  header>span:last-child,.ui.top>span:last-child,header>small{display:none!important}\n  footer,.ui.bot{flex-wrap:wrap!important;row-gap:8px!important;padding-bottom:max pHint=show;})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "pin-art", "name": "Pin Art", "group": "Pro", "c": "#8fa3ff", "desc": "A pin-screen toy: press in and watch the pins rise.", "raw": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Pin Art Text<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Inter:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%;overflow:hidden;background:#101114}\n  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:none}\n  .ui{position:fixed;left:0;right:0;padding:18px 26px;display:flex;justify-content:space-between;font:500 12px Inter,system-ui;color:#80838c;letter-spacing:.12em;text-transform:uppercase;z-index:2;pointer-events:none}\n  .top{top:0}.bot{bottom:0;justify-content:center;gap:10px;pointer-events:auto}\n  input{font:500 14px Inter;letter-spacing:.06em;padding:11px 16px;border-radius:10px;border:1px solid #2a2c33;background:#17181c;color:#eceef2;width:240px;outline:none;text-transform:uppercase}\n  button{font:500 12px Inter;letter-spacing:.12em;padding:11px 16px;border-radius:10px;border:1px solid #2a2c33;background:#1d1e23;color:#d6d8de;cursor:pointer;text-transform:uppercase}\n  button:hover{border-color:#8fa3ff}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\"><\/canvas>\n<div class=\"ui top\"><span>Pin Art \u00b7 tactile text<\/span><span>press into the pins \u00b7 click to send a wave<\/span><\/div>\n<div class=\"ui bot\"><input id=\"inp\" value=\"PRESS\" maxlength=\"10\" aria-label=\"Your text\"><button id=\"flat\">Flatten<\/button><\/div>\n<script>\nconst cv=document.getElementById('c'),inp=document.getElementById('inp');let ctx,W,H,P=[],S,cols,rows,mx=-999,my=-999,down=false,waves=[],flatT=0;\nfunction size(){const d=Math.m once:true});\n  window.__ppHint=show;})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "glass-shatter", "name": "Glass Shatter", "group": "Physics", "c": "#9fd6ff", "desc": "Smash the word into shards; it rebuilds itself.", "raw": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Glass Shatter Text<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%;overflow:hidden;background:#06090d}\n  canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}\n  .ui{position:fixed;left:0;right:0;padding:20px 26px;display:flex;justify-content:space-between;font:12px \"JetBrains Mono\",monospace;color:#5d7487;letter-spacing:.08em;z-index:2;pointer-events:none}\n  .top{top:0}.bot{bottom:0;justify-content:center;gap:10px;pointer-events:auto}\n  input{font:inherit;font-size:14px;padding:11px 16px;border:1px solid #1d2c3a;background:#0b121a;color:#cfe6f7;width:240px;outline:none;text-transform:uppercase}\n  button{font:inherit;font-size:13px;padding:11px 16px;border:1px solid #1d2c3a;background:#0f1b27;color:#cfe6f7;cursor:pointer}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\"><\/canvas>\n<div class=\"ui top\"><span>GLASS SHATTER \u00b7 physics text<\/span><span>click anywhere on the glass to smash it<\/span><\/div>\n<div class=\"ui bot\"><input id=\"inp\" value=\"FRAGILE\" maxlength=\"12\" aria-label=\"Your text\"><button id=\"snd\">SOUND: ON<\/button><\/div>\n<script>\nconst cv=document.getElementById('c'),inp=document.getElementById('inp');let ctx,W,H,off,oc,alpha,box,state='whole',shards=[],cracks=[],flash=0,shake=0,timer=0,sound=true;\nlet AC=null;\nfunction tinkle(n){if(!sound)return;AC=AC||new (window.AudioContext||window.webkitAudioConte sform:uppercase}\n  button{font:500 13px \"Chakra Petch\";letter-spacing:.12em;padding:10px 16px;border:1px solid #ff5a1f;background:#2a1208;color:#ffb38a;cursor:pointer;text-transform:uppercase}\n  .stat{position:fixed;right:26px;top:46px;font:500 12px \"Chakra Petch\";color:#ff7a3d;letter-spacing:.12em;z-index:2}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\"><\/canvas>\n<div class=\"ui top\"><span>Laser Etch \u00b7 futuristic text<\/span><span>a laser engraves your word into steel<\/span><\/div>\n<div class=\"stat\" id=\"stat\">PWR 0%<\/div>\n<div class=\"ui bot\"><input id=\"inp\" value=\"TITAN\" maxlength=\"10\" aria-label=\"Your text\"><button id=\"go\">Engrave<\/button><\/div>\n<script>\nconst cv=document.getElementById('c'),inp=document.getElementById('inp'),stat=document.getElementById('stat');\nlet ctx,W,H,dpr,plate,cool,hot,box,band,bands=[],cur=0,headX=0,dir=1,sparks=[],t=0,ink;\nfunction size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);\n  plate=document.createElement('canvas');plate.width=W;plate.height=H;const p=plate.getContext('2d');\n  const g=p.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5d636b');g.addColorStop(.5,'#3c4148');g.addColorStop(1,'#2a2e33');p.fillStyle=g;p.fillRect(0,0,W,H);\n  for(let i=0;i<H*1.2;i++){p.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},255,${Math.random()*.04})`;p.fillRect(0,Math.random()*H,W,1)}\n  for(const [x,y] of [[30,70],[W-30,70],[30,H-90],[W-30,H-90]]){p.fillStyle='#22262b';p.beginPath();p.arc(x,y,9,0,6.28);p.fill();p.fillStyle='#7a828c';p.beginPath();p.arc(x,y,6,0,6.28);p.fill();p.strokeStyle='#30353b';p.lineWidth=2;p.beginPath();p.moveTo(x-4,y);p.lineTo(x+4,y);p.stroke()}\n  prep();}\nfunction prep(){\n  const txt=(inp.value||' ').toUpperCase();const m=document.createElement('canvas');m.width=W;m.height=H;const c=m.getContext('2d');\n  let fs=Math.min(H*.3,W*1.5/Math.max(4,txt.length));c.font=`900 ${fs}px \"Exo 2\", sans-serif`;const w=c.measureText(txt).width;if(w>W*.86){fs*=W*.86/w;c.font=`900 ${fs}px \"Exo 2\", sans-serif`}\n  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(txt,W/2,H*.46);\n  ink=c.getImageData(0,0,W,H).data;\n  const mw=c.measureText(txt).width;box={x:W/2-mw/2-4,y:H*.46-fs*.55,w:mw+8,h:fs*1.1};\n  // engraved (cool) look\n  cool=document.createElement('canvas');cool.width=W;cool.height=H;const k=cool.getContext('2d');\n  const tint=(cv2,fill)=>{const q=document.createElement('canvas');q.width=W;q.height=H;const x=q.getContext('2d');x.drawImage(cv2,0,0);x.globalCompositeOperation='source-in';x.fillStyle=fill;x.fillRect(0,0,W,H);return q};\n  k.drawImage(tint(m,'rgba(225,232,240,.55)'),0,2);k.drawImage(tint(m,'rgba(0,0,0,.6)'),0,-1.5);\n  const g=k.createLinearGradient(box.x,box.y,box.x+box.w,box.y+box.h);g.addColorStop(0,'#2c3a8a');g.addColorStop(.35,'#6a3f9a');g.addColorStop(.65,'#9a5a4a');g.addColorStop(1,'#c99a3a');\n  k.drawImage(tint(m,g),0,0);\n  k.globalCompositeOperation='source-atop';k.fillStyle='rgba(0,0,0,.35)';for(let y=box.y;y<box.y+box.h;y+=3)k.fillRect(box.x,y,box.w,1);\n  k.globalCompositeOperation='source-over';\n  hot=document.createElement('canvas');hot.width=W;hot.height=H;const h=hot.getContext('2d');h.shadowColor='#ff6a1a';h.shadowBlur=18;h.drawImage(m,0,0);h.globalCompositeOperation='source-in';\n  const hg=h.createLinearGradient(0,box.y,0,box.y+box.h);hg.addColorStop(0,'#fff6d8');hg.addColorStop(.5,'#ffb04a');hg.addColorStop(1,'#ff4a12');h.fillStyle=hg;h.fillRect(0,0,W,H);\n  band=Math.max(4,Math.round(fs/34));bands=[];for(let y=box.y;y<box.y+box.h;y+=band){let e=true;for(let x=box.x;x<box.x+box.w&&e;x+=2)for(let yy=y;yy<y+band;yy+=2)if(inkAt(x,yy)){e=false;break}bands.push({y,t0:-1,empty:e})}cur=0;headX=box.x;dir=1;\n}\nfunction inkAt(x,y){x|=0;y|=0;return x>=0&&y>=0&&x<W&&y<H&&ink[(y*W+x)*4+3]>60}\nfunction frame(){\n  t++;ctx.drawImage(plate,0,0,W,H);\n  // advance the head across the current band\n  let firing=false;\n  while(cur<bands.length&&bands[cur].empty){bands[cur].t0=t-200;cur++}\n  if(cur<bands.length){const sp=Math.max(30,box.w/9);headX+=sp*dir;const b=bands[cur];\n    if(headX>box.x+box.w||headX<box.x){b.t0=t;cur++;dir*=-1;headX=dir>0?box.x:box.x+box.w}\n    for(let k=0;k<4;k++){const sx=headX-sp*dir*k/4;if(inkAt(sx,b.y+band/2)){firing=true;break}}}\n  // cooled engraving for finished bands + current partial band\n  for(let i=0;i<bands.length;i++){const b=bands[i];if(b.t0<0&&i!==cur)continue;\n    let x0=box.x,x1=box.x+box.w;if(i===cur&&b.t0<0){if(dir>0)x1=headX;else x0=headX}\n    ctx.save();ctx.beginPath();ctx.rect(x0,b.y,x1-x0,band+.5);ctx.clip();ctx.drawImage(cool,0,0,W,H);\n    const age=b.t0<0?0:t-b.t0,heat=Math.exp(-age/45);if(heat>.02){ctx.globalAlpha=heat;ctx.globalCompositeOperation='lighter';ctx.drawImage(hot,0,0,W,H)}ctx.restore()}\n  // laser\n  if(cur<bands.length){const hy=bands[cur].y+band/2;stat.textContent='PWR '+(firing?100:12)+'% \u00b7 ROW '+(cur+1)+'/'+bands.length;\n    ctx.save();ctx.globalCompositeOperation='lighter';\n    ctx.strokeStyle=firing?'rgba(255,90,30,.9)':'rgba(255,90,30,.25)';ctx.lineWidth=firing?3:1;ctx.beginPath();ctx.moveTo(headX,0);ctx.lineTo(headX,hy);ctx.stroke();\n    ctx.strokeStyle='rgba(255,230,200,.9)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(headX,0);ctx.lineTo(headX,hy);ctx.stroke();\n    if(firing){const g=ctx.createRadialGradient(headX,hy,0,headX,hy,40);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.2,'rgba(255,160,60,.8)');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(headX,hy,40,0,6.28);ctx.fill();\n      for(let i=0;i<4;i++)sparks.push({x:headX,y:hy,vx:(Math.random()-.5)*8-dir*2,vy:-Math.random()*6-1,l:1})}\n    ctx.restore();\n    ctx.fillStyle='#1b1e22';ctx.fillRect(headX-18,0,36,26);ctx.fillStyle='#ff5a1f';ctx.fillRect(headX-3,26,6,6);ctx.fillStyle='#3a3f46';ctx.fillRect(0,10,W,6);\n  }else{stat.textContent='COMPLETE'}\n  ctx.save();ctx.globalCompositeOperation='lighter';\n  sparks=sparks.filter(s=>(s.l-=.03)>0);for(const s of sparks){s.vy+=.3;s.x+=s.vx;s.y+=s.vy;ctx.strokeStyle=`rgba(255,${150+s.l*100|0},80,${s.l})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*1.5,s.y-s.vy*1.5);ctx.stroke()}\n  ctx.restore();\n  // smoke haze over hot areas\n  requestAnimationFrame(frame)}\ndocument.getElementById('go').onclick=prep;inp.addEventListener('change',prep);inp.addEventListener('keydown',e=>{if(e.key==='Enter')prep()});\naddEventListener('resize',size);\ndocument.fonts.load('900 40px \"Exo 2\"').then(size,size);size();frame();\n<\/script>\n\n\n\n<!--pro-polish-->\n<style id=\"pro-polish\">\n  header,.ui.top{flex-wrap:nowrap!important;gap:12px}\n  header>span:last-child,.ui.top>span:last-child,header>small{display:none!important}\n  footer,.ui.bot{flex-wrap:wrap!important;row-gap:8px!important;padding-bottom:max(18px,env(safe-area-inset-bottom))!important}\n  .pp-hint{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);z-index:50;padding:9px 16px;border-radius:999px;font:500 13px/1.2 system-ui,-apple-system,\"Segoe UI\",sans-serif;letter-spacing:.01em;\n    background:rgba(16,18,24,.72);color:#f2f4f8;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.12);\n    opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}\n  .pp-hint.on{opacity:1;transform:translate(-50%,0)}\n  .pp-hint::first-letter{text-transform:uppercase}\n  @media (max-width:640px){\n    footer,.ui.bot{gap:8px!important;padding-left:12px!important;padding-right:12px!important}\n    footer input[type=text],footer input:not([type]),.ui.bot input[type=text],.ui.bot input:not([type]){width:auto!important;min-width:0!important;max-width:none!important;flex:1 1 110px}\n    footer button,.ui.bot button{padding-left:10 {\n  t.removeAttribute('textLength');t.setAttribute('font-size',210);\n  const w=t.getComputedTextLength();const size=w>1080?210*1080/w:210;\n  t.setAttribute('font-size',size);sh.setAttribute('font-size',size);\n  box=t.getBBox();makeDrips();\n}\nfunction makeDrips(){\n  drips.innerHTML='';ds=[];\n  const n=Math.max(4,Math.round(box.width/90));\n  for(let i=0;i<n;i++){\n    const x=box.x+box.width*(0.06+0.88*Math.random());\n    const g=document.createElementNS(NS,'g');\n    const stem=document.createElementNS(NS,'rect');const bead=document.createElementNS(NS,'circle');\n    stem.setAttribute('class','drip');bead.setAttribute('class','drip');\n    g.append(stem,bead);drips.append(g);\n    ds.push({x,top:box.y+box.height*0.78,w:5+Math.random()*7,len:0,max:30+Math.random()*80,sp:.15+Math.random()*.35,stem,bead,fall:-1});\n  }\n}\nfunction tick(){\n  time+=1/60;\n  lx+=(tx-lx)*.08;ly+=(ty-ly)*.08;\n  light.setAttribute('x',lx);light.setAttribute('y',ly);\n  const f=0.009+Math.sin(time*.4)*.0015, g=0.022+Math.sin(time*.27)*.004;\n  turb.setAttribute('baseFrequency',f.toFixed(4)+' '+g.toFixed(4));\n  splash*=.94;\n  disp.setAttribute('scale',(heatV+splash).toFixed(1));\n  const rate=heatV/12;\n  for(const d of ds){\n    if(d.fall<0){d.len+=d.sp*rate; if(d.len>d.max){d.fall=0}}\n    else{d.fall+=2+d.fall*.08; if(d.fall>320){d.len=0;d.fall=-1;d.max=30+Math.random()*80}}\n    const L=Math.max(0,d.len);\n    d.stem.setAttribute('x',d.x-d.w/2*.55);d.stem.setAttribute('width',d.w*.55);\n    d.stem.setAttribute('y',d.top);d.stem.setAttribute('height',d.fall<0?L:Math.max(0,L-d.fall*.6));\n    d.bead.setAttribute('cx',d.x);d.bead.setAttribute('cy',d.top+L+(d.fall>0?d.fall:0));\n    d.bead.setAttribute('r',d.w*(0.55+Math.min(1,L/d.max)*.45));\n    d.bead.style.opacity=d.fall>0?Math.max(0,1-d.fall/320):1;\n  }\n  requestAnimationFrame(tick);\n}\nfunction toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}\naddEventListener('pointermove',e=>{const p=toSvg(e);tx=p.x;ty=p.y-260});\naddEventListener('pointerdown',e=>{if(e.target.closest('footer'))return;splash=40;for(const d of ds){d.len+=20}});\ninp.addEventListener('input',()=>{const v=inp.value.toUpperCase()||' ';t.textContent=v;sh.textContent=v;fit()});\nheat.addEventListener('input',()=>heatV=+heat.value);\ndocument.fonts.ready.then(fit);fit();tick();\n<\/script>\n\n\n\n<!--pro-polish-->\n<style id=\"pro-polish\">\n  header,.ui.top{flex-wrap:nowrap!important;gap:12px}\n  header>span:last-child,.ui.top>span:last-child,header>small{display:none!important}\n  footer,.ui.bot{flex-wrap:wrap!important;row-gap:8px!important;padding-bottom:max(18px,env(safe-area-inset-bottom))!important}\n  .pp-hint{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);z-index:50;padding:9px 16px;border-radius:999px;font:500 13px/1.2 system-ui,-apple-system,\"Segoe UI\",sans-serif;letter-spacing:.01em;\n    background:rgba(16,18,24,.72);color:#f2f4f8;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.12);\n    opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}\n  .pp-hint.on{opacity:1;transform:translate(-50%,0)}\n  .pp-hint::first-letter{text-transform:uppercase}\n  @media (max-width:640px){\n    footer,.ui.bot{gap:8px!important;padding-left:12px!important;padding-right:12px!important}\n    footer input[type=text],footer input:not([type]),.ui.bot input[type=text],.ui.bot input:not([type]){width:auto!important;min-width:0!important;max-width:none!important;flex:1 1 110px}\n    footer button,.ui.bot button{padding-left:10px!important;padding-right:10px!important;font-size:11px!important;flex:none}\n    footer label,.ui.bot label{font-size:11px!important}footer input[type=range],.ui.bot input[type=range]{width:80px!important}\n    .pp-hint{bottom:132px;font-size:12p );document.body.classList.remove('off');\n  chars.forEach((_,i)=>{let t=Math.random()*500;const flick=2+Math.floor(Math.random()*4);\n    for(let k=0;k<flick;k++){setTimeout(()=>setDim(i,false),t);t+=40+Math.random()*90;setTimeout(()=>setDim(i,true),t);t+=40+Math.random()*120}\n    setTimeout(()=>setDim(i,false),t)});\n}\nfunction buzz(){\n  if(on&&chars.length){if(Math.random()<.5){setDim(bad,true);setTimeout(()=>setDim(bad,false),50+Math.random()*90)}\n    if(Math.random()<.15){setTimeout(()=>{setDim(bad,true);setTimeout(()=>setDim(bad,false),40)},150)}}\n  document.querySelector('.wash').style.opacity=on?(.85+Math.random()*.15):0;\n  setTimeout(buzz,300+Math.random()*1600);\n}\ndocument.getElementById('sw1').onclick=power;\ninp.addEventListener('input',()=>{build();if(on)chars.forEach((_,i)=>setDim(i,false))});\nbuild();setTimeout(power,600);buzz();addEventListener('resize',()=>{build();if(on)chars.forEach((_,i)=>setDim(i,false))});\n<\/script>\n\n\n\n<!--pro-polish-->\n<style id=\"pro-polish\">\n  header,.ui.top{flex-wrap:nowrap!important;gap:12px}\n  header>span:last-child,.ui.top>span:last-child,header>small{display:none!important}\n  footer,.ui.bot{flex-wrap:wrap!important;row-gap:8px!important;padding-bottom:max(18px,env(safe-area-inset-bottom))!important}\n  .pp-hint{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);z-index:50;padding:9px 16px;border-radius:999px;font:500 13px/1.2 system-ui,-apple-system,\"Segoe UI\",sans-serif;letter-spacing:.01em;\n    background:rgba(16,18,24,.72);color:#f2f4f8;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.12);\n    opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}\n  .pp-hint.on{opacity:1;transform:translate(-50%,0)}\n  .pp-hint::first-letter{text-transform:uppercase}\n  @media (max-width:640px){\n    footer,.ui.bot{gap:8px!important;padding-left:12px!important;padding-right:12px!important}\n    footer input[type=text],footer input:not([type]),.ui.bot input[type=text],.ui.bot input:not([type]){width:auto!important;min-width:0!important;max-width:none!important;flex:1 1 110px}\n    footer button,.ui.bot button{padding-left:10px!important;padding-right:10px!important;font-size:11px!important;flex:none}\n    footer label,.ui.bot label{font-size:11px!important}footer input[type=range],.ui.bot input[type=range]{width:80px!important}\n    .pp-hint{bottom:132px;font-size:12px}\n  }\n  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}\n<\/style>\n<script id=\"pro-polish-js\">\n(()=>{const h=document.querySelector('header>span:last-child,.ui.top>span:last-child,header>small');if(!h)return;\n  const t=h.textContent.trim();if(!t)return;const el=document.createElement('div');el.className='pp-hint';el.textContent=t.replace(/^[a-z ]*text \u00b7 /i,'');document.body.append(el);\n  let shown=false;const show=()=>{el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),4200)};\n  setTimeout(show,700);addEventListener('pointerdown',()=>{if(!shown){shown=true;el.classList.remove('on')}},{once:true});\n  window.__ppHint=show;})();\n<\/script>\n<\/body>\n<\/html>\n"}],GROUPS={"Websites": "Hero headlines inside real-looking landing pages", "Pro": "Polished pieces for real products", "Physics": "Throw it, break it, drop it", "Futuristic": "Sci-fi interfaces and effects", "Interactive": "Text that reacts to you", "Material": "What the letters are made of"},NEW=new Set(['Websites']);

    const b=document.createElement('button');b.className='it'+(i===cur?' on':'');b.style.setProperty('--c',s.c);b.innerHTML='<i></i>'+s.name+(NEW.has(s.group)?'<span class="new">NEW</span>':'');b.onclick=()=>show(i);nav.append(b);s.btn=b})}
function show(i){cur=(i+S.length)%S.length;const s=S[cur];f.classList.remove('ready');f.srcdoc=s.raw.replace('</head>','<style>header,.ui.top{visibility:hidden!important}</style></head>');

  S.forEach((x,k)=>x.btn&&x.btn.classList.toggle('on',k===cur));if(s.btn)s.btn.scrollIntoView({block:'nearest',inline:'nearest'});history.replaceState(null,'','#'+s.id)}
