<title>Cloud Code</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
/* Layout: one fixed WebGL canvas plays the whole journey while a tall empty track gives the page its scroll. The scene draws its own sky and dark data space, so the page sets fixed colors in both themes. */
:root{
  --ground:#06080d; --ink:#eef3ff; --mut:#9aa6c0; --glass:rgba(10,14,24,.6); --line:rgba(255,255,255,.14); --acc:#8fd3ff; --on:#04121c;

  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y}
.track{height:760vh;position:relative;z-index:0}
.hud{color:var(--ink);position:fixed;inset:0;z-index:2;pointer-events:none;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--pix);font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.brand i{width:12px;height:12px;background:var(--acc);display:inline-block;box-shadow:4px 4px 0 rgba(143,211,255,.35)}
.phase{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;padding:0 16px}
.hud.light{--ink:#13204a;color:#13204a}
.hud.light .brand,.hud.light .phase b{text-shadow:0 2px 0 rgba(255,255,255,.35)}
.phase b{display:block;font-family:var(--pix);font-weight:700;font-size:clamp(28px,6vw,64px);line-height:1;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.18);transition:opacity .35s}
.phase span{display:block;margin-top:10px;color:var(--ink);opacity:.82;font-size:13px;transition:opacity .35s}
.rail{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.rail div{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:10px;opacity:.5;transition:opacity .3s}
.rail div i{width:8px;height:8px;border:1px solid currentColor;display:inline-block}
.rail div.on{opacity:1}.rail div.on i{background:var(--acc);border-color:var(--acc)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--ink);opacity:.75;white-space:nowrap}
.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:4;width:292px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-top b{font-family:var(--pix);font-weight:400;font-size:12px}
.toggle{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.grp{margin-top:12px}
.grp>span{display:block;color:var(--mut);font-size:11.5px;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button,.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:12px;cursor:pointer}
.seg button:hover,.btn:hover{background:rgba(255,255,255,.11)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.seg button:focus-visible,.toggle:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.panel.closed .grp{display:none}
.note{color:var(--mut);font-size:11px;margin-top:8px}
#gl.hov{cursor:pointer}
@media (max-width:640px){
  .panel{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto}

}

<canvas id="gl" aria-label="Pixel clouds that turn into moving lines of code as you scroll"></canvas>
<div class="track" aria-hidden="true"></div>

<div class="hud light" id="hud">
  <div class="brand"><i></i>Cloud Code</div>
  <div class="rail" id="rail">
    <div data-i="0">Clouds<i></i></div><div data-i="1">Into the data<i></i></div><div data-i="2">Spin<i></i></div><div data-i="3">Left &amp; right<i></i></div><div data-i="4">Zoom out<i></i></div>
  </div>
  <div class="phase" aria-live="polite"><b id="phT">Above the clouds</b><span id="phS">Scroll down to fall through them</span></div>
  <div class="hint" id="hint">Scroll · click an image · move fast to dissolve</div>
</div>

<div class="panel" id="panel">
  <div class="panel-top"><b>Make it yours</b><button class="toggle" id="tog" type="button" aria-expanded="true">Hide</button></div>
  <div class="grp"><span>Pixel size</span><div class="seg" id="segPx">
    <button type="button" data-v="9" aria-pressed="false">Chunky</button><button type="button" data-v="6" aria-pressed="true">Medium</button><button type="button" data-v="4" aria-pressed="false">Fine</button>
  </div></div>
  <div class="grp"><span>Sky</span><div class="seg" id="segSky">
    <button type="button" data-v="0" aria-pressed="true">Day</button><button type="button" data-v="1" aria-pressed="false">Dusk</button><button type="button" data-v="2" aria-pressed="false">Night</button>
  </div></div>
  <div class="grp"><span>What the lines say</span><div class="seg" id="segCode">
    <button type="button" data-v="js" aria-pressed="true">Code</button><button type="button" data-v="data" aria-pressed="false">Data</button><button type="button" data-v="bin" aria-pressed="false">Binary</button>
  </div></div>
  <div class="grp"><span>Code color</span><div class="seg" id="segTint">
    <button type="button" data-v="syntax" aria-pressed="true">Syntax</button><button type="button" data-v="matrix" aria-pressed="false">Matrix</button><button type="button" data-v="ice" aria-pressed="false">Ice</button><button type="button" data-v="amber" aria-pressed="false">Amber</button>
  </div></div>
  <div class="grp"><span>Images</span><div class="row2">
    <button class="btn" type="button" id="upBtn">Use my image</button><button class="btn" type="button" id="wrapAll">Wrap all</button>
    <input type="file" id="upFile" accept="image/*" hidden>
  </div><div class="note">Your image replaces the one you clicked last.</div></div>
</div>
