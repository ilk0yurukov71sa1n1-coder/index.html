<style>
/* Layout: a lab page. Tabs pick one of 8 components, the dark stage below shows it live with your photos, and the editor under it changes the photos and text. The stage keeps a dark studio look in both themes; the page around it follows the system theme. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#17161a; --mut:#5e5a55; --line:rgba(23,22,26,.12); --acc:#d9661f; --on:#fff; --chip:rgba(23,22,26,.05);

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0f0f12; --surface:#18181d; --ink:#f3f0ea; --mut:#a9a49c; --line:rgba(255,255,255,.12); --acc:#ffb36b; --on:#24140a; --chip:rgba(255,255,255,.06); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0f0f12; --surface:#18181d; --ink:#f3f0ea; --mut:#a9a49c; --line:rgba(255,255,255,.12); --acc:#ffb36b; --on:#24140a; --chip:rgba(255,255,255,.06); color-scheme:dark }
*{box-sizing:border-box}
html{background:var(--bg)}

header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header small{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
header h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,5vw,58px);line-height:1;margin:6px 0 0}
header p{margin:8px 0 0;color:var(--mut);max-width:560px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button i{font-style:normal;font-size:12px;color:var(--mut)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button[aria-selected="true"] i{color:inherit;opacity:.7}
.tabs button:focus-visible,.acts button:focus-visible,.ed input:focus-visible,.ed textarea:focus-visible,.ed label:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.desc{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.desc p{margin:0;color:var(--mut)}
.desc b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px}
.acts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.stage{border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.ed-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px;gap:12px;flex-wrap:wrap}
.ed-h h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0}
.ed-h p{margin:0;color:var(--mut);font-size:14px}
.eds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ed label.ph{position:relative;display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--chip)}
.ed label.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ed label.ph span{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px}

.ed label.ph.drag{outline:2px dashed var(--acc);outline-offset:-4px}

.ed textarea{resize:vertical;min-height:70px}

.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){ .eds{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .eds{grid-template-columns:1fr} .tabs{flex-wrap:nowrap;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:0 16px 4px} .tabs button{flex:none} }

<div class="wrap">
  <header>
    <div><small>Studio · Components</small><h1>Photo <em>Reveal</em></h1><p>Cards for your photos and info. Click one and it opens with its own 3D move. Put your own photos and text in below.</p></div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="desc"><p id="desc"></p><div class="acts"><button type="button" id="cpH">Copy HTML</button><button type="button" id="cpR">Copy React</button></div></div>

  <div class="eds" id="eds"></div>
</div>
<div class="toast" id="toast" role="status"></div>

{ id:"unfold", name:"Unfold", desc:"The photo lifts off the grid and unfolds like a folded letter, one panel after another.",
  css:[
  ".uf-sheet{position:absolute;z-index:5;transform-style:preserve-3d}",

  build:function(root, items, H){
    var busy = false;

    for (var g = 0; g < 70; g++) { x.fillStyle = "rgba(255,235,200," + (.2 + r() * .5) + ")"; var gx = W * .5 + (r() - .5) * 120 * (1 + g / 30), gy = Hh * .5 + g * 3.2; x.fillRect(gx, gy, 10 + r() * 30, 1.5); }
